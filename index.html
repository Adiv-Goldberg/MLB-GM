<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBGM - Advanced Roster Management</title>
    
    <link rel="icon" type="image/png" href="https://1000logos.net/wp-content/uploads/2017/04/MLB-Logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Mobile Touch-to-Drag Polyfill -->
    <script src="https://unpkg.com/drag-drop-touch"></script>
    
    <!-- HTML2Canvas for Exporting PNGs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        
        :root {
            /* Fallback Sky Blue Theme */
            --team-primary: #38bdf8;
            --team-secondary: #0ea5e9;
        }

        body { 
            background: #020617; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            overflow-x: hidden;
            font-size: 13px;
        }

        /* Dynamic Theme Classes */
        .text-theme { color: var(--team-primary) !important; }
        .bg-theme { background-color: var(--team-primary) !important; }
        .border-theme { border-color: var(--team-primary) !important; }
        .hover-border-theme:hover { border-color: var(--team-primary) !important; }
        .group:hover .group-hover\:text-theme { color: var(--team-primary) !important; }

        .draggable-card { cursor: pointer; transition: border-color 0.2s ease, transform 0.1s ease; }
        .draggable-card:active { transform: scale(0.98); }
        .draggable-card.dragging { opacity: 0.5; transform: scale(0.95); }
        .card-content-wrapper { pointer-events: none; }
        
        .drop-zone { border: 2px dashed rgba(148, 163, 184, 0.1); border-radius: 0.5rem; transition: all 0.2s ease; }
        .drop-zone.active { border-color: var(--team-primary); box-shadow: 0 0 15px var(--team-primary); background-color: rgba(255,255,255,0.05); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--team-primary); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const SHEET_ID = '1lYm3UsPwx4ff9tWNDucvEV0l-5f5NAcGV8nn4TOjRf4';

        const TEAM_DB_INIT = [
            { id: 110, name: "Baltimore Orioles", abbr: "BAL", color: '#df4601', secondary: '#000000' },
            { id: 111, name: "Boston Red Sox", abbr: "BOS", color: '#bd3039', secondary: '#0c2340' },
            { id: 147, name: "New York Yankees", abbr: "NYY", color: '#003087', secondary: '#e4002c' },
            { id: 139, name: "Tampa Bay Rays", abbr: "TB", color: '#092c5c', secondary: '#8fbce6' },
            { id: 141, name: "Toronto Blue Jays", abbr: "TOR", color: '#134a8e', secondary: '#1d2d5c' },
            { id: 144, name: "Atlanta Braves", abbr: "ATL", color: '#ce1141', secondary: '#13274f' },
            { id: 146, name: "Miami Marlins", abbr: "MIA", color: '#00a3e0', secondary: '#ef3340' },
            { id: 121, name: "New York Mets", abbr: "NYM", color: '#ff5910', secondary: '#002d72' },
            { id: 143, name: "Philadelphia Phillies", abbr: "PHI", color: '#e81828', secondary: '#002d72' },
            { id: 120, name: "Washington Nationals", abbr: "WSH", color: '#ab0003', secondary: '#14225a' },
            { id: 145, name: "Chicago White Sox", abbr: "CWS", color: '#27251f', secondary: '#c4ced4' },
            { id: 114, name: "Cleveland Guardians", abbr: "CLE", color: '#e31937', secondary: '#002b5c' },
            { id: 116, name: "Detroit Tigers", abbr: "DET", color: '#0c2340', secondary: '#fa4616' },
            { id: 118, name: "Kansas City Royals", abbr: "KC", color: '#004687', secondary: '#bd9b60' },
            { id: 142, name: "Minnesota Twins", abbr: "MIN", color: '#002b5c', secondary: '#d31145' },
            { id: 112, name: "Chicago Cubs", abbr: "CHC", color: '#0e3386', secondary: '#cc3433' },
            { id: 113, name: "Cincinnati Reds", abbr: "CIN", color: '#c6011f', secondary: '#000000' },
            { id: 158, name: "Milwaukee Brewers", abbr: "MIL", color: '#12284b', secondary: '#ffc52f' },
            { id: 134, name: "Pittsburgh Pirates", abbr: "PIT", color: '#fdb827', secondary: '#27251f' },
            { id: 138, name: "St. Louis Cardinals", abbr: "STL", color: '#c41e3a', secondary: '#0c2340' },
            { id: 117, name: "Houston Astros", abbr: "HOU", color: '#002d62', secondary: '#eb6e1f' },
            { id: 108, name: "Los Angeles Angels", abbr: "LAA", color: '#003263', secondary: '#ba0021' },
            { id: 133, name: "Oakland Athletics", abbr: "ATH", color: '#003831', secondary: '#efb21e' },
            { id: 136, name: "Seattle Mariners", abbr: "SEA", color: '#0c2c56', secondary: '#005c5c' },
            { id: 140, name: "Texas Rangers", abbr: "TEX", color: '#003278', secondary: '#c0111f' },
            { id: 109, name: "Arizona Diamondbacks", abbr: "ARI", color: '#a71930', secondary: '#e3d4ad' },
            { id: 115, name: "Colorado Rockies", abbr: "COL", color: '#33006f', secondary: '#c4ced4' },
            { id: 119, name: "Los Angeles Dodgers", abbr: "LAD", color: '#005a9c', secondary: '#ef3e42' },
            { id: 135, name: "San Diego Padres", abbr: "SD", color: '#2f241d', secondary: '#ffc425' },
            { id: 137, name: "San Francisco Giants", abbr: "SF", color: '#fd5a1e', secondary: '#27251f' }
        ];

        const POS_OPTIONS = ["All", "P", "C", "1B", "2B", "3B", "SS", "INF", "LF", "CF", "RF", "OF", "DH"];

        const formatMoney = (amount) => {
            if (!amount || isNaN(amount)) return "$0";
            if (amount >= 1000000) return `$${(amount / 1000000).toFixed(1)}M`;
            if (amount >= 1000) return `$${Math.round(amount / 1000)}k`;
            return `$${Math.round(amount)}`;
        };

        const parseCurrencyString = (str) => {
            if (!str) return 0;
            const cleaned = str.toString().replace(/[^0-9.]/g, '');
            if (!cleaned) return 0;
            let val = parseFloat(cleaned);
            if (val > 0 && val < 100) val = val * 1000000;
            return val;
        };

        const Toast = ({ notification }) => {
            if (!notification) return null;
            const bg = notification.type === 'error' ? 'bg-rose-600' : notification.type === 'warning' ? 'bg-amber-500' : 'bg-emerald-600';
            return (
                <div className={`fixed bottom-6 right-6 px-6 py-3 rounded-xl shadow-2xl z-[9999] text-white font-semibold transition-all duration-300 ${bg} flex items-center gap-3`}>
                    {notification.type === 'success' && <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>}
                    {notification.msg}
                </div>
            );
        };

        const PlayerImage = ({ player, teamInfo, className, style }) => {
            const [hasError, setHasError] = useState(false);
            const mlbUrl = `https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/${player.id}/headshot/silo/current`;
            const fallbackUrl = `https://placehold.co/120x120/${teamInfo.color.replace('#','')}/ffffff?text=${player.initials}`;
            return (
                <img 
                    src={hasError || !player.id || player.id === "N/A" || player.id.toString().startsWith("unk") ? fallbackUrl : mlbUrl} 
                    onError={() => setHasError(true)} alt={player.name} className={className} style={style} crossOrigin="anonymous"
                />
            );
        };

        const PlayerCard = ({ player, teamInfo, onClick }) => {
            const isFA = player.acquiredVia === 'FA' && player.expiryType !== 'Retained';
            const isTraded = player.originalTeamId && player.originalTeamId !== teamInfo.id;
            
            let bgLogo = `https://www.mlbstatic.com/team-logos/${teamInfo.id}.svg`;
            if (isFA) bgLogo = "https://1000logos.net/wp-content/uploads/2017/04/MLB-Logo.png";
            else if (isTraded) bgLogo = `https://www.mlbstatic.com/team-logos/${player.originalTeamId}.svg`;

            return (
                <div
                    className="draggable-card relative overflow-hidden bg-slate-900 border border-slate-700/60 hover-border-theme rounded-lg w-full flex items-center p-2 gap-2.5 group shadow-sm shrink-0"
                    draggable="true"
                    onDragStart={(e) => {
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('playerId', String(player.id));
                        e.dataTransfer.setData('sourceTeamId', String(teamInfo.id));
                        setTimeout(() => e.target.classList.add('dragging'), 0);
                    }}
                    onDragEnd={(e) => e.target.classList.remove('dragging')}
                    onClick={(e) => { e.stopPropagation(); if (onClick) onClick(player); }}
                >
                    <div className="card-content-wrapper absolute -right-2 top-1/2 -translate-y-1/2 w-16 h-16 opacity-5">
                        <img src={bgLogo} className="w-full h-full object-contain" crossOrigin="anonymous" />
                    </div>

                    <div className="card-content-wrapper relative shrink-0 w-9 h-9">
                        <PlayerImage player={player} teamInfo={teamInfo} className="w-full h-full rounded-full border border-slate-600 bg-slate-950 object-cover" />
                        <div className="absolute -bottom-1 -right-1 bg-slate-800 border border-slate-600 text-[8px] font-bold px-1 rounded text-slate-200">{['SP', 'RP'].includes(player.position) ? 'P' : player.position}</div>
                    </div>

                    <div className="card-content-wrapper flex-1 min-w-0 flex flex-col justify-center">
                        <div className="font-semibold text-slate-200 text-xs truncate group-hover:text-theme transition-colors">{player.name}</div>
                        <div className="flex gap-1 mt-0.5 items-center">
                            {player.teamRank && <span className="text-[8px] bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30 px-1 rounded font-medium">#{player.teamRank}</span>}
                            {player.top100Rank && <span className="text-[8px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1 rounded font-medium">T100 #{player.top100Rank}</span>}
                            {!player.teamRank && !player.top100Rank && <span className="text-[9px] text-slate-400">{player.age}y • {player.expiryType}</span>}
                        </div>
                    </div>

                    <div className="card-content-wrapper shrink-0 text-right flex flex-col items-end pr-1">
                        <span className="text-emerald-400 font-bold text-[11px]">{formatMoney(player.cbtValue)}</span>
                        <span className="text-slate-500 text-[8px] font-medium">{player.remaining}y left</span>
                    </div>
                </div>
            );
        };

        const DropZone = ({ id, label, players, onDrop, teamInfo, onPlayerClick, className="" }) => {
            return (
                <div
                    className={`drop-zone flex flex-col min-h-[60px] h-full bg-slate-900/30 p-2 ${className}`}
                    onDrop={(e) => {
                        e.preventDefault();
                        e.currentTarget.classList.remove('active');
                        onDrop(e.dataTransfer.getData('playerId'), String(id), e.dataTransfer.getData('sourceTeamId'));
                    }}
                    onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
                    onDragEnter={(e) => { e.preventDefault(); e.currentTarget.classList.add('active'); }}
                    onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('active'); }}
                >
                    {label && (
                        <div className="flex justify-between items-center mb-2 px-1 border-b border-slate-800 pb-1">
                            <span className="text-[10px] font-bold text-theme uppercase tracking-wider">{label}</span>
                            <span className="text-[10px] font-bold text-slate-500 bg-slate-800/50 px-2 rounded-full">{players?.length || 0}</span>
                        </div>
                    )}
                    <div className="flex-1 flex flex-col gap-1.5">
                        {players?.map(p => <PlayerCard key={p.id} player={p} teamInfo={teamInfo} onClick={onPlayerClick} />)}
                        {(!players || players.length === 0) && <div className="flex-1 flex items-center justify-center border-2 border-dashed border-slate-800/50 rounded-lg text-slate-600 text-[10px] uppercase font-bold tracking-wider min-h-[40px]">Empty</div>}
                    </div>
                </div>
            );
        };

        const fetchTeamData = async (team, year, mode) => {
            const sheetName = `${team.abbr} - ${team.name}`;
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
            
            const res = await fetch(url);
            if (!res.ok) throw new Error("Fetch failed.");
            const text = await res.text();
            if (text.includes("html") || text.trim() === "") throw new Error("Sheet not found or empty.");

            const rows = text.split('\n').map(row => {
                const re = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                return row.split(re).map(val => val.replace(/^"|"$/g, '').trim());
            });

            const dataRows = rows.slice(1).filter(r => r.length > 5 && r[1] && !r[1].includes("Name") && !r[0].includes("ID"));
            
            const roster = [];
            let lineupCount = 1;
            let rotationCount = 1;
            let bullpenCount = 1;

            dataRows.forEach((r, idx) => {
                const rawId = r[0] || `unk-${team.abbr}-${idx}`;
                const rawName = r[1] || "Unknown";
                const initials = rawName.split(' ').map(w => w[0]).join('').substring(0, 2);
                const age = parseInt(r[2]) || 25;
                let pos = r[3] || "UT";
                const level = r[4] || "Minors";
                let status = r[5] || "Minors";
                let injury = r[6] || "";
                const svcTime = parseFloat(r[7]) || 0;
                
                const extractNumber = (str) => {
                    if (str === undefined || str === null || str === "") return 0;
                    const cleaned = str.toString().replace(/[^0-9]/g, '');
                    return parseInt(cleaned, 10) || 0;
                };
                const optionsLeft = extractNumber(r[8]);
                
                const stats = {
                    fWAR: r[9] || "", G: r[10] || "", PA: r[11] || "", IP: r[12] || "", 
                    AVG: r[13] || "", OBP: r[14] || "", SLG: r[15] || "", ERA: r[16] || "", 
                    WHIP: r[17] || "", K: r[18] || "", BB: r[19] || ""
                };

                let aav = parseCurrencyString(r[20]);
                let remaining = extractNumber(r[22]);
                let expiryType = r[23] || "UFA";
                
                const teamRank = r[24] && !isNaN(parseInt(r[24])) ? parseInt(r[24]) : null;
                const top100Rank = r[25] && !isNaN(parseInt(r[25])) ? parseInt(r[25]) : null;
                
                let cbtList = [parseCurrencyString(r[26]), parseCurrencyString(r[27]), parseCurrencyString(r[28]), parseCurrencyString(r[29]), parseCurrencyString(r[30])];
                let cbtValue = cbtList[0] || aav || 0;
                
                const is40Man = status === '40-Man' || status === '26-Man Active' || status.includes('60-day');
                const isMajors = status === '26-Man Active' || injury.match(/60|15|10|7/) || status === '40-Man';

                let faStatus = 'Under Contract';
                if (mode === 'offseason') {
                    const expLow = (expiryType || "").toLowerCase();
                    if (remaining <= 1) {
                        if (status === 'Minors' || level === 'Minors' || expLow.includes('minor')) {
                            faStatus = 'Under Contract'; 
                        } else if (expLow.includes('pre-arb') || expLow.includes('auto')) {
                            faStatus = 'Under Contract'; 
                            aav = (aav || 740000) + 25000;
                            cbtValue = aav;
                            cbtList = [aav, aav, aav, aav, aav];
                            remaining = 2; 
                            const nextSvc = svcTime + 1;
                            expiryType = nextSvc < 2 ? 'Pre-Arb' : (nextSvc < 5 ? 'Arb' : 'UFA');
                        } else if (expLow.includes('opt')) {
                            faStatus = 'Option';
                        } else if (expLow.includes('arb')) {
                            faStatus = 'Arb'; 
                        } else {
                            faStatus = 'UFA';
                        }
                    }
                }

                const displayRemaining = remaining > 0 ? remaining - 1 : 0;

                let fieldSpot = 'Minors';
                let battingOrder = null;
                let pitchingOrder = null;

                if (faStatus !== 'Under Contract') {
                    fieldSpot = 'Pending FA';
                } else if (injury.includes('60')) {
                    fieldSpot = 'IL60';
                    injury = 'Injured 60-Day';
                } else if (injury.includes('15') || injury.includes('10')) {
                    fieldSpot = 'IL15';
                } else if (injury.includes('7')) {
                    fieldSpot = 'IL7';
                } else if (isMajors) {
                    if (pos === 'P') {
                        if (rotationCount <= 5) { fieldSpot = 'Rotation'; pitchingOrder = rotationCount++; pos = 'SP'; }
                        else { fieldSpot = 'Bullpen'; pitchingOrder = bullpenCount++; pos = 'RP'; }
                    } else if (pos === 'SP') {
                        fieldSpot = 'Rotation'; pitchingOrder = rotationCount++;
                    } else if (pos === 'RP') {
                        fieldSpot = 'Bullpen'; pitchingOrder = bullpenCount++;
                    } else {
                        if (lineupCount <= 9) { fieldSpot = 'Lineup'; battingOrder = lineupCount; lineupCount++; }
                        else { fieldSpot = 'Bench'; }
                    }
                } else {
                    if (pos === 'P') pos = 'RP'; 
                }

                roster.push({
                    id: String(rawId), name: rawName, initials, position: pos, age, level, rosterStatus: status, injury, svcTime,
                    optionsLeft, contractStatus: expiryType, aav, remaining: displayRemaining, expiryType, cbtValue, cbtList, teamRank, top100Rank, is40Man,
                    stats, faStatus, fieldSpot, battingOrder, pitchingOrder, originalTeamId: team.id, acquiredVia: 'Draft'
                });
            });
            
            return { ...team, roster, deadMoney: 0, transactions: [] };
        };

        const TopNavbar = ({ team, activeTab, setActiveTab, exportSave, clearSession, handleLoadGame }) => {
            const tabs = [
                { id: 'roster', label: 'Dashboard' },
                { id: 'field', label: 'Field View' },
                { id: 'trades', label: 'Trades' },
                { id: 'stats', label: 'Statistics' },
                { id: 'fa', label: 'Free Agency' },
                { id: 'add', label: 'Add Player' }
            ];

            return (
                <header className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 z-[200]">
                    <div className="flex items-center gap-6">
                        <div className="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity" onClick={clearSession}>
                            <img src={`https://www.mlbstatic.com/team-logos/${team.id}.svg`} className="w-10 h-10 drop-shadow-lg" />
                            <div className="hidden sm:block">
                                <h1 className="text-white font-bold text-sm tracking-wide leading-tight">{team.name}</h1>
                                <p className="text-theme text-[9px] uppercase font-bold tracking-widest">Change Team</p>
                            </div>
                        </div>
                        <nav className="hidden md:flex items-center gap-1.5 bg-slate-950/60 p-1.5 rounded-xl border border-slate-800/80">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition-all ${activeTab === t.id ? 'bg-theme text-white shadow-md' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}>
                                    {t.label}
                                </button>
                            ))}
                        </nav>
                    </div>
                    <div className="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg p-1 shadow-sm">
                        <label className="hover:bg-slate-800 text-slate-200 px-3 py-1.5 rounded-md text-xs font-bold uppercase tracking-wider transition-colors cursor-pointer flex items-center gap-1.5">
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            Load
                            <input type="file" accept=".mlbgm" className="hidden" onChange={handleLoadGame} />
                        </label>
                        <div className="w-px h-4 bg-slate-700"></div>
                        <button onClick={exportSave} className="hover:bg-slate-800 text-slate-200 px-3 py-1.5 rounded-md text-xs font-bold uppercase tracking-wider transition-colors flex items-center gap-1.5">
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Save
                        </button>
                    </div>
                </header>
            );
        };

        const TeamSelect = ({ onSelect, showNotification }) => {
            const [mode, setMode] = useState('offseason');
            const [loadingTeam, setLoadingTeam] = useState(null);

            const handleTeamClick = async (team) => {
                setLoadingTeam(team.id);
                showNotification(`Connecting to ${team.abbr} database...`, 'info');
                try {
                    const data = await fetchTeamData(team, 2026, mode);
                    showNotification(`Database loaded successfully!`, 'success');
                    onSelect(data, mode, 2026);
                } catch (err) {
                    showNotification(`Failed to load data for ${team.abbr}`, 'error');
                } finally {
                    setLoadingTeam(null);
                }
            };

            const handleLoadGame = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const state = JSON.parse(event.target.result);
                        if (!state.teamData || !state.setupData) throw new Error("Invalid Format");
                        onSelect(state.teamData, state.setupData.mode, state.setupData.year);
                        showNotification(`Restored ${state.teamData.name} save file!`, 'success');
                    } catch (err) {
                        showNotification("Corrupted save file", "error");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-slate-950 relative overflow-y-auto w-full">
                    {loadingTeam && (
                        <div className="absolute inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center">
                            <div className="spinner mb-4"></div>
                            <h2 className="text-xl font-bold text-theme uppercase tracking-widest">Loading Analytics...</h2>
                        </div>
                    )}
                    
                    <div className="flex items-center gap-4 mb-8 mt-10">
                        <img src="https://1000logos.net/wp-content/uploads/2017/04/MLB-Logo.png" className="w-16 h-10 object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]" />
                        <h1 className="text-5xl font-black text-slate-100 tracking-tighter drop-shadow-md">MLB<span className="text-theme">GM</span></h1>
                    </div>
                    
                    <div className="glass-panel rounded-2xl p-8 mb-10 w-full max-w-xl text-center shadow-2xl">
                        <label className="text-slate-400 font-bold uppercase text-xs tracking-widest block mb-4">Select 2026 Sandbox</label>
                        <div className="flex gap-4 justify-center mb-6">
                            <button onClick={() => setMode('offseason')} className={`flex-1 py-3 rounded-lg font-bold text-sm transition-all ${mode === 'offseason' ? 'bg-theme text-white shadow-[0_0_15px_rgba(56,189,248,0.4)]' : 'bg-slate-900 text-slate-400 border border-slate-700 hover:text-white hover:bg-slate-800'}`}>Offseason Mode</button>
                            <button onClick={() => setMode('tdl')} className={`flex-1 py-3 rounded-lg font-bold text-sm transition-all ${mode === 'tdl' ? 'bg-theme text-white shadow-[0_0_15px_rgba(56,189,248,0.4)]' : 'bg-slate-900 text-slate-400 border border-slate-700 hover:text-white hover:bg-slate-800'}`}>Trade Deadline Mode</button>
                        </div>
                        <div className="border-t border-slate-800/50 pt-6 flex flex-col items-center">
                            <label className="text-slate-300 border border-slate-700 hover:bg-slate-800 px-6 py-2.5 rounded-lg font-bold uppercase tracking-wider cursor-pointer transition-colors text-xs flex items-center gap-2">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                Restore .mlbgm Save File
                                <input type="file" accept=".mlbgm" className="hidden" onChange={handleLoadGame} />
                            </label>
                        </div>
                    </div>

                    <div className="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-4 w-full max-w-5xl pb-10">
                        {TEAM_DB_INIT.map(t => (
                            <div key={t.id} onClick={() => handleTeamClick(t)} className="bg-slate-900 border border-slate-800/80 p-5 rounded-xl hover-border-theme hover:bg-slate-800 cursor-pointer transition-all flex flex-col items-center group shadow-md hover:shadow-[0_0_20px_rgba(56,189,248,0.15)]">
                                <img src={`https://www.mlbstatic.com/team-logos/${t.id}.svg`} className="w-14 h-14 mb-3 group-hover:scale-110 transition-transform drop-shadow-md" />
                                <h3 className="text-[10px] font-bold text-slate-400 text-center uppercase tracking-wider group-hover:text-white">{t.name}</h3>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const RosterDashboard = ({ team, setTeam, setupData, showNotification, showTxLog, setShowTxLog }) => {
            const [farmSearch, setFarmSearch] = useState('');
            const [farmSort, setFarmSort] = useState('Rank');
            const [minorsFilter, setMinorsFilter] = useState('All');
            const [farmFilter, setFarmFilter] = useState('All');
            const [ilFilter, setIlFilter] = useState('All');
            const [activePlayerModal, setActivePlayerModal] = useState(null);

            const handleDrop = (playerId, targetId, sourceTeamId) => {
                setTeam(prev => {
                    const newRoster = [...prev.roster];
                    const player = newRoster.find(p => p.id === String(playerId));
                    if (!player) return prev;

                    const tIdStr = String(targetId);

                    if (!isNaN(targetId)) {
                        const occupant = newRoster.find(p => p.battingOrder === parseInt(targetId) && p.fieldSpot === 'Lineup');
                        if (occupant && occupant.id !== player.id) {
                            occupant.battingOrder = player.fieldSpot === 'Lineup' ? player.battingOrder : null;
                            occupant.fieldSpot = player.fieldSpot === 'Lineup' ? 'Lineup' : 'Bench';
                            if (occupant.fieldSpot === 'Bench' && ['P', 'SP', 'RP'].includes(occupant.position)) occupant.position = 'DH';
                        }
                        player.pitchingOrder = null;
                        player.battingOrder = parseInt(targetId);
                        player.fieldSpot = 'Lineup';
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                    } else if (tIdStr.startsWith('Rot-')) {
                        const newOrder = parseInt(tIdStr.split('-')[1]);
                        const occupant = newRoster.find(p => p.pitchingOrder === newOrder && p.fieldSpot === 'Rotation');
                        if (occupant && occupant.id !== player.id) {
                            occupant.pitchingOrder = player.fieldSpot === 'Rotation' ? player.pitchingOrder : null;
                            occupant.fieldSpot = player.fieldSpot === 'Rotation' ? 'Rotation' : 'Bullpen';
                        }
                        player.battingOrder = null;
                        player.pitchingOrder = newOrder;
                        player.fieldSpot = 'Rotation';
                        player.position = 'SP';
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                    } else if (tIdStr.startsWith('Pen-')) {
                        const newOrder = parseInt(tIdStr.split('-')[1]);
                        const occupant = newRoster.find(p => p.pitchingOrder === newOrder && p.fieldSpot === 'Bullpen');
                        if (occupant && occupant.id !== player.id) {
                            occupant.pitchingOrder = player.fieldSpot === 'Bullpen' ? player.pitchingOrder : null;
                            occupant.fieldSpot = player.fieldSpot === 'Bullpen' ? 'Bullpen' : 'Bench';
                            if (occupant.fieldSpot === 'Bench' && ['P', 'SP', 'RP'].includes(occupant.position)) occupant.position = 'DH';
                        }
                        player.battingOrder = null;
                        player.pitchingOrder = newOrder;
                        player.fieldSpot = 'Bullpen';
                        player.position = 'RP';
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                    } else {
                        if (tIdStr === 'Lineup') {
                            player.pitchingOrder = null;
                            const used = newRoster.filter(p => p.fieldSpot === 'Lineup').map(p => p.battingOrder).filter(Boolean);
                            let next = 1; while(used.includes(next)) next++; player.battingOrder = next;
                        } else player.battingOrder = null;
                        
                        if (tIdStr === 'Rotation') {
                            player.battingOrder = null;
                            const used = newRoster.filter(p => p.fieldSpot === 'Rotation').map(p => p.pitchingOrder).filter(Boolean);
                            let next = 1; while(used.includes(next)) next++; player.pitchingOrder = next; player.position = 'SP';
                        } else if (tIdStr === 'Bullpen') {
                            player.battingOrder = null;
                            const used = newRoster.filter(p => p.fieldSpot === 'Bullpen').map(p => p.pitchingOrder).filter(Boolean);
                            let next = 1; while(used.includes(next)) next++; player.pitchingOrder = next; player.position = 'RP';
                        } else {
                            player.pitchingOrder = null;
                        }
                        
                        player.fieldSpot = tIdStr;
                        if (tIdStr === 'Bench' && ['P', 'SP', 'RP'].includes(player.position)) player.position = 'DH';
                    }
                    
                    if (['IL7', 'IL15', 'IL60'].includes(tIdStr)) {
                        player.rosterStatus = tIdStr;
                        player.injury = `Injured ${tIdStr.replace('IL', '')}-Day`;
                    } else if (!tIdStr.startsWith('IL') && tIdStr !== 'Pending FA') {
                        player.injury = ""; 
                    }
                    
                    if (tIdStr === 'Minors') { player.is40Man = false; player.rosterStatus = 'Minors'; player.injury = ""; }
                    else if (tIdStr === '40-Man Minor') { player.is40Man = true; player.rosterStatus = '40-Man'; player.injury = ""; }
                    else if (tIdStr !== 'Lineup' && !isNaN(targetId) === false && !tIdStr.startsWith('Rot-') && !tIdStr.startsWith('Pen-') && !tIdStr.startsWith('IL')) { 
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = ""; 
                    }

                    return { ...prev, roster: newRoster };
                });
            };

            const handlePlayerAction = (action, meta = null) => {
                if (!activePlayerModal) return;
                const playerId = activePlayerModal.id;
                setTeam(prev => {
                    const roster = [...prev.roster];
                    const p = roster.find(x => String(x.id) === String(playerId));
                    if (!p) return prev;

                    if (action === 'role') {
                        p.fieldSpot = meta;
                        if (meta === 'Lineup') {
                            const used = roster.filter(x => x.fieldSpot === 'Lineup' && x.id !== p.id).map(x => x.battingOrder).filter(Boolean);
                            let next = 1; while(used.includes(next)) next++;
                            p.battingOrder = next;
                            p.pitchingOrder = null;
                        } else if (['Rotation', 'Bullpen'].includes(meta)) {
                            const used = roster.filter(x => x.fieldSpot === meta && x.id !== p.id).map(x => x.pitchingOrder).filter(Boolean);
                            let next = 1; while(used.includes(next)) next++;
                            p.pitchingOrder = next;
                            p.battingOrder = null;
                        } else {
                            p.battingOrder = null;
                            p.pitchingOrder = null;
                            if (['P', 'SP', 'RP'].includes(p.position)) p.position = 'DH';
                        }
                        p.is40Man = true; p.rosterStatus = '26-Man Active'; p.injury = "";
                        showNotification(`Moved ${p.name} to ${meta}`, 'success');
                    } else if (action === 'minors') {
                        if (p.optionsLeft > 0) {
                            p.optionsLeft -= 1; p.fieldSpot = 'Minors'; p.is40Man = false; p.rosterStatus = 'Minors'; p.injury = "";
                            showNotification(`Optioned ${p.name} to Minors`, 'success');
                        } else {
                            p.fieldSpot = 'Minors'; p.is40Man = false; p.rosterStatus = 'Minors'; p.injury = "";
                            showNotification(`${p.name} DFA'd / sent to Minors`, 'warning');
                        }
                    } else if (action === 'promote') {
                        p.fieldSpot = ['P','SP','RP'].includes(p.position) ? 'Bullpen' : 'Bench';
                        p.is40Man = true; p.rosterStatus = '26-Man Active'; p.injury = "";
                        if(p.fieldSpot === 'Bullpen') p.pitchingOrder = (roster.filter(x=>x.fieldSpot==='Bullpen') || []).length + 1;
                        showNotification(`Promoted ${p.name}`, 'success');
                    } else if (action === 'il') {
                        p.fieldSpot = meta; p.rosterStatus = meta;
                        p.injury = `Injured ${meta.replace('IL', '')}-Day`;
                        showNotification(`Placed ${p.name} on ${meta}`, 'warning');
                    }
                    return { ...prev, roster };
                });
                setActivePlayerModal(null);
            };

            const lineupPlayers = team.roster?.filter(p => p.fieldSpot === 'Lineup') || [];
            const bench = team.roster?.filter(p => p.fieldSpot === 'Bench') || [];
            const rotation = team.roster?.filter(p => p.fieldSpot === 'Rotation') || [];
            const bullpen = team.roster?.filter(p => p.fieldSpot === 'Bullpen') || [];
            
            let il = team.roster?.filter(p => p.fieldSpot !== 'Pending FA' && (p.fieldSpot?.startsWith('IL') || p.injury?.toLowerCase().includes('injured') || p.rosterStatus?.startsWith('IL'))) || [];
            if (ilFilter !== 'All') il = il.filter(p => p.fieldSpot === ilFilter || p.rosterStatus === ilFilter || p.injury?.includes(ilFilter.replace('IL','')));
            
            let minors = team.roster?.filter(p => ['Minors', '40-Man Minor'].includes(p.fieldSpot)) || [];
            if (farmSearch) minors = minors.filter(p => p.name.toLowerCase().includes(farmSearch.toLowerCase()));
            if (farmFilter === 'Top 30') minors = minors.filter(p => p.teamRank && p.teamRank <= 30);
            else if (farmFilter === 'Top 100') minors = minors.filter(p => p.top100Rank && p.top100Rank <= 100);
            else if (farmFilter === '40-Man') minors = minors.filter(p => p.is40Man);
            if (minorsFilter !== 'All') minors = minors.filter(p => p.level === minorsFilter);
            
            minors.sort((a, b) => {
                if (farmSort === 'Rank') return (a.teamRank || 999) - (b.teamRank || 999);
                if (farmSort === 'Age') return a.age - b.age;
                if (farmSort === 'Name') return a.name.localeCompare(b.name);
                return 0;
            });

            const activeCount = lineupPlayers.length + bench.length + rotation.length + bullpen.length;
            const count40 = team.roster?.filter(p => p.is40Man && !p.fieldSpot?.startsWith('IL') && p.fieldSpot !== 'Pending FA').length || 0;
            const payroll = team.roster?.filter(p => p.fieldSpot !== 'Pending FA').reduce((sum, p) => sum + p.cbtValue, 0) + (team.deadMoney || 0);

            // Dynamic Pitching Maps (Extends Infinitely if assigned, always leaves 1 empty drop slot at bottom)
            const rotSlots = Array.from({length: Math.max(5, Math.max(0, ...rotation.map(p => p.pitchingOrder || 0)) + 1)}, (_, i) => i + 1);
            const penSlots = Array.from({length: Math.max(4, Math.max(0, ...bullpen.map(p => p.pitchingOrder || 0)) + 1)}, (_, i) => i + 1);

            return (
                <div className="w-full h-full overflow-y-auto custom-scrollbar relative" id="scroll-container">
                    <div className="sticky top-0 z-[50] w-full px-6 py-3 flex justify-between items-center bg-slate-950 border-b border-slate-800/80 shadow-md">
                        <div className="flex gap-4 items-center">
                            <span className="text-theme font-bold uppercase tracking-wider text-xs">Roster Dashboard</span>
                        </div>
                        <div className="flex gap-2">
                            <div className="bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700/50 text-center"><div className="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Active Roster</div><div className={`text-sm font-black ${activeCount>26?'text-rose-400':'text-slate-100'}`}>{activeCount}/26</div></div>
                            <div className="bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700/50 text-center"><div className="text-[9px] text-slate-400 uppercase font-bold tracking-wider">40-Man</div><div className={`text-sm font-black ${count40>40?'text-rose-400':'text-slate-100'}`}>{count40}/40</div></div>
                            <div className="bg-slate-900 px-4 py-1.5 rounded-lg border border-slate-700/50 text-center"><div className="text-[9px] text-slate-400 uppercase font-bold tracking-wider">CBT Payroll</div><div className="text-sm font-black text-emerald-400">{formatMoney(payroll)}</div></div>
                        </div>
                    </div>

                    {activePlayerModal && (
                        <div className="fixed inset-0 z-[200] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                                <div className="flex items-center gap-4 mb-5 border-b border-slate-800 pb-4">
                                    <PlayerImage player={activePlayerModal} teamInfo={team} className="w-14 h-14 rounded-full border-2 border-slate-700 object-cover bg-slate-950" />
                                    <div>
                                        <h3 className="text-lg font-black text-slate-100 leading-tight">{activePlayerModal.name}</h3>
                                        <p className="text-xs text-slate-400 font-medium">{['SP', 'RP'].includes(activePlayerModal.position) ? 'P' : activePlayerModal.position} • {formatMoney(activePlayerModal.cbtValue)}</p>
                                    </div>
                                </div>
                                <div className="space-y-2 mb-5">
                                    <div className="text-[10px] text-theme font-bold uppercase tracking-widest mb-2">Move to Role</div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => handlePlayerAction('role', 'Rotation')} className="bg-slate-800 hover-bg-theme border border-slate-700 hover-border-theme py-2 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition-colors">Rotation</button>
                                        <button onClick={() => handlePlayerAction('role', 'Bullpen')} className="bg-slate-800 hover-bg-theme border border-slate-700 hover-border-theme py-2 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition-colors">Bullpen</button>
                                        <button onClick={() => handlePlayerAction('role', 'Bench')} className="bg-slate-800 hover-bg-theme border border-slate-700 hover-border-theme py-2 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition-colors">Bench</button>
                                        {['Minors', '40-Man Minor'].includes(activePlayerModal.fieldSpot) ? (
                                            <button onClick={() => handlePlayerAction('promote')} className="bg-emerald-900/50 hover:bg-emerald-600 border border-emerald-700 py-2 rounded-lg text-xs font-bold text-emerald-300 hover:text-white transition-colors">Promote to MLB</button>
                                        ) : (
                                            <button onClick={() => handlePlayerAction('minors')} className="bg-slate-800 hover:bg-amber-600/30 border border-slate-700 hover:border-amber-500 py-2 rounded-lg text-xs font-bold text-amber-300 transition-colors">{activePlayerModal.optionsLeft > 0 ? `Option to Minors (${activePlayerModal.optionsLeft})` : 'DFA / Minors'}</button>
                                        )}
                                    </div>
                                    <div className="text-[10px] text-rose-400 font-bold uppercase tracking-widest mt-4 mb-2">Injured List</div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <button onClick={() => handlePlayerAction('il', 'IL7')} className="bg-rose-950/40 hover:bg-rose-900 border border-rose-900/50 hover:border-rose-500 py-2 rounded-lg text-[11px] font-bold text-rose-300 transition-colors">7-Day</button>
                                        <button onClick={() => handlePlayerAction('il', 'IL15')} className="bg-rose-950/40 hover:bg-rose-900 border border-rose-900/50 hover:border-rose-500 py-2 rounded-lg text-[11px] font-bold text-rose-300 transition-colors">15-Day</button>
                                        <button onClick={() => handlePlayerAction('il', 'IL60')} className="bg-rose-950/40 hover:bg-rose-900 border border-rose-900/50 hover:border-rose-500 py-2 rounded-lg text-[11px] font-bold text-rose-300 transition-colors">60-Day</button>
                                    </div>
                                </div>
                                <button onClick={() => setActivePlayerModal(null)} className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs uppercase tracking-wider transition-colors">Cancel</button>
                            </div>
                        </div>
                    )}

                    <div className="p-6 max-w-[1600px] mx-auto">
                        {team.transactions?.length > 0 && (
                            <div className="glass-panel p-4 rounded-2xl mb-6 flex flex-col">
                                <div className="flex justify-between items-center mb-3 border-b border-slate-700/50 pb-2">
                                    <h3 className="text-xs font-bold text-sky-400 uppercase tracking-widest">Detailed Transaction Log</h3>
                                    <button onClick={() => setShowTxLog(!showTxLog)} className="text-[10px] font-bold text-slate-400 bg-slate-800 hover:text-white px-2 py-1 rounded transition-colors">
                                        {showTxLog ? 'Collapse Log' : 'Expand Log'}
                                    </button>
                                </div>
                                {showTxLog && (
                                    <div className="flex flex-col gap-2">
                                        {team.transactions.map((tx, i) => (
                                            <div key={i} className="flex gap-4">
                                                {tx.type === 'trade' ? (
                                                    <div className="flex w-full items-stretch justify-between text-xs bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50">
                                                        <div className="flex items-center justify-center w-[60px] shrink-0 border-r border-slate-800/50 pr-2">
                                                            <img src={`https://www.mlbstatic.com/team-logos/${tx.teamA?.id}.svg`} className="w-12 h-12 drop-shadow-md" crossOrigin="anonymous" />
                                                        </div>
                                                        <div className="flex flex-col justify-center flex-1 px-4 min-w-0 gap-1.5 py-1 items-start text-left">
                                                            {tx.receivedByA?.map(p => (
                                                                <div key={`A-${p.id}`} className="text-slate-200 text-[11px] font-bold whitespace-nowrap">
                                                                    <span className="text-sky-400 mr-1">►</span>{p.name} <span className="text-slate-500 font-medium ml-1">({['SP', 'RP'].includes(p.position) ? 'P' : p.position})</span>
                                                                </div>
                                                            ))}
                                                            {tx.receivedByA?.length === 0 && <span className="text-slate-500 italic text-[10px]">Salary Relief</span>}
                                                        </div>
                                                        <div className="flex items-center justify-center shrink-0 px-2 text-slate-500 font-bold">↔</div>
                                                        <div className="flex flex-col justify-center flex-1 px-4 min-w-0 gap-1.5 py-1 items-end text-right">
                                                            {tx.receivedByB?.map(p => (
                                                                <div key={`B-${p.id}`} className="text-slate-200 text-[11px] font-bold whitespace-nowrap">
                                                                    <span className="text-slate-500 font-medium mr-1">({['SP', 'RP'].includes(p.position) ? 'P' : p.position})</span> {p.name} <span className="text-amber-400 ml-1">◄</span>
                                                                </div>
                                                            ))}
                                                            {tx.receivedByB?.length === 0 && <span className="text-slate-500 italic text-[10px]">Salary Relief</span>}
                                                        </div>
                                                        <div className="flex items-center justify-center w-[60px] shrink-0 border-l border-slate-800/50 pl-2">
                                                            <img src={`https://www.mlbstatic.com/team-logos/${tx.teamB?.id}.svg`} className="w-12 h-12 drop-shadow-md" crossOrigin="anonymous" />
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="flex flex-1 items-center gap-3 text-xs bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50">
                                                        <img src={tx.logo} className="w-6 h-6 object-contain" crossOrigin="anonymous"/>
                                                        <span className="text-emerald-400 font-semibold">{tx.msg}</span>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                        
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="flex flex-col gap-6">
                                <div className="glass-panel p-4 rounded-2xl">
                                    <div className="flex justify-between items-center mb-3 px-1 border-b border-slate-700/50 pb-2">
                                        <h3 className="text-xs font-bold text-theme uppercase tracking-widest">Starting Lineup</h3>
                                        <span className="text-xs font-bold text-slate-500 bg-slate-800 px-2 py-0.5 rounded-full">{lineupPlayers.length}/9</span>
                                    </div>
                                    <div className="flex flex-col gap-1.5">
                                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(slotNum => {
                                            const p = lineupPlayers.find(x => x.battingOrder === slotNum);
                                            return (
                                                <div key={slotNum} className="flex items-center gap-2" onDrop={(e) => { e.preventDefault(); handleDrop(e.dataTransfer.getData('playerId'), slotNum, e.dataTransfer.getData('sourceTeamId')); }} onDragOver={(e) => e.preventDefault()}>
                                                    <div className="w-6 text-center font-black text-xs text-theme/70">#{slotNum}</div>
                                                    <div className="flex-1 bg-slate-900/50 border border-slate-800/80 rounded-lg min-h-[46px]">
                                                        {p ? <PlayerCard player={p} teamInfo={team} onClick={setActivePlayerModal} /> : <div className="h-full flex items-center justify-center text-[10px] text-slate-600 font-bold uppercase tracking-wider">Empty Spot</div>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="glass-panel p-4 rounded-2xl flex-1">
                                    <DropZone id="Bench" label="Bench" players={bench} onDrop={handleDrop} teamInfo={team} onPlayerClick={setActivePlayerModal} className="!border-none !bg-transparent !p-0" />
                                </div>
                            </div>

                            <div className="flex flex-col gap-6">
                                <div className="glass-panel p-4 rounded-2xl drop-zone transition-colors"
                                     onDrop={(e) => { e.preventDefault(); e.currentTarget.classList.remove('active'); const tgt = e.dataTransfer.getData('playerId'); if(tgt) handleDrop(tgt, 'Rotation', e.dataTransfer.getData('sourceTeamId')); }}
                                     onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
                                     onDragEnter={(e) => { e.preventDefault(); e.currentTarget.classList.add('active'); }}
                                     onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('active'); }}>
                                    <div className="flex justify-between items-center mb-3 px-1 border-b border-slate-700/50 pb-2 pointer-events-none">
                                        <h3 className="text-xs font-bold text-theme uppercase tracking-widest">Starting Rotation</h3>
                                        <span className="text-xs font-bold text-slate-500 bg-slate-800 px-2 py-0.5 rounded-full">{rotation.length}/5</span>
                                    </div>
                                    <div className="flex flex-col gap-1.5">
                                        {rotSlots.map(slotNum => {
                                            const p = rotation.find(x => x.pitchingOrder === slotNum);
                                            return (
                                                <div key={slotNum} className="flex items-center gap-2" onDrop={(e) => { e.preventDefault(); e.stopPropagation(); handleDrop(e.dataTransfer.getData('playerId'), `Rot-${slotNum}`, e.dataTransfer.getData('sourceTeamId')); }} onDragOver={(e) => e.preventDefault()}>
                                                    <div className="w-8 text-center font-black text-[10px] text-theme/70 pointer-events-none">SP{slotNum}</div>
                                                    <div className="flex-1 bg-slate-900/50 border border-slate-800/80 rounded-lg min-h-[46px] relative z-10">
                                                        {p ? <PlayerCard player={p} teamInfo={team} onClick={setActivePlayerModal} /> : <div className="h-full flex items-center justify-center text-[10px] text-slate-600 font-bold uppercase tracking-wider pointer-events-none">Empty Spot</div>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="glass-panel p-4 rounded-2xl flex-1 drop-zone transition-colors"
                                     onDrop={(e) => { e.preventDefault(); e.currentTarget.classList.remove('active'); const tgt = e.dataTransfer.getData('playerId'); if(tgt) handleDrop(tgt, 'Bullpen', e.dataTransfer.getData('sourceTeamId')); }}
                                     onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
                                     onDragEnter={(e) => { e.preventDefault(); e.currentTarget.classList.add('active'); }}
                                     onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('active'); }}>
                                    <div className="flex justify-between items-center mb-3 px-1 border-b border-slate-700/50 pb-2 pointer-events-none">
                                        <h3 className="text-xs font-bold text-theme uppercase tracking-widest">Bullpen</h3>
                                        <span className="text-xs font-bold text-slate-500 bg-slate-800 px-2 py-0.5 rounded-full">{bullpen.length}/8+</span>
                                    </div>
                                    <div className="flex flex-col gap-1.5">
                                        {penSlots.map(slotNum => {
                                            const p = bullpen.find(x => x.pitchingOrder === slotNum);
                                            const label = slotNum === 1 ? 'CL' : slotNum <= 3 ? 'SU' : 'RP';
                                            return (
                                                <div key={slotNum} className="flex items-center gap-2" onDrop={(e) => { e.preventDefault(); e.stopPropagation(); handleDrop(e.dataTransfer.getData('playerId'), `Pen-${slotNum}`, e.dataTransfer.getData('sourceTeamId')); }} onDragOver={(e) => e.preventDefault()}>
                                                    <div className="w-8 text-center font-black text-[10px] text-theme/70 pointer-events-none">{label}</div>
                                                    <div className="flex-1 bg-slate-900/50 border border-slate-800/80 rounded-lg min-h-[46px] relative z-10">
                                                        {p ? <PlayerCard player={p} teamInfo={team} onClick={setActivePlayerModal} /> : <div className="h-full flex items-center justify-center text-[10px] text-slate-600 font-bold uppercase tracking-wider pointer-events-none">Empty Spot</div>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-col gap-6">
                                <div className="glass-panel p-4 rounded-2xl border border-rose-900/30 bg-rose-950/10 flex flex-col h-[360px]">
                                    <div className="flex justify-between items-center mb-3 pb-2 border-b border-rose-900/30">
                                        <span className="text-[11px] text-rose-400 font-bold uppercase tracking-widest">Injured List</span>
                                        <select value={ilFilter} onChange={e=>setIlFilter(e.target.value)} className="bg-rose-950/50 text-rose-300 text-[10px] p-1 rounded border border-rose-900/50 outline-none font-bold">
                                            <option value="All">Show All</option><option value="IL7">7-Day IL</option><option value="IL15">15-Day IL</option><option value="IL60">60-Day IL</option>
                                        </select>
                                    </div>
                                    <div 
                                        className="flex-1 overflow-y-auto pr-1 drop-zone transition-colors custom-scrollbar"
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            e.currentTarget.classList.remove('active');
                                            handleDrop(e.dataTransfer.getData('playerId'), ilFilter === 'All' ? 'IL15' : ilFilter, e.dataTransfer.getData('sourceTeamId'));
                                        }}
                                        onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
                                        onDragEnter={(e) => { e.preventDefault(); e.currentTarget.classList.add('active', '!border-rose-500', '!bg-rose-950/20'); }}
                                        onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('active', '!border-rose-500', '!bg-rose-950/20'); }}
                                    >
                                        <div className="flex flex-col gap-1.5 content-start">
                                            {il.map(p => <PlayerCard key={p.id} player={p} teamInfo={team} onClick={setActivePlayerModal} />)}
                                        </div>
                                    </div>
                                </div>
                                <div className="glass-panel p-4 rounded-2xl flex flex-col h-[520px]">
                                    <div className="flex flex-col mb-3 pb-2 border-b border-slate-700/50 gap-2">
                                        <div className="flex justify-between items-center w-full">
                                            <span className="text-[11px] text-slate-300 font-bold uppercase tracking-widest shrink-0">Farm System</span>
                                            <div className="flex gap-1.5 items-center flex-wrap justify-end">
                                                <select value={farmSort} onChange={e=>setFarmSort(e.target.value)} className="bg-slate-900 text-white text-[10px] p-1 rounded border border-slate-700 outline-none font-bold">
                                                    <option value="Rank">Sort: Rank</option><option value="Age">Sort: Age</option><option value="Name">Sort: Name</option>
                                                </select>
                                                <select value={minorsFilter} onChange={e=>setMinorsFilter(e.target.value)} className="bg-slate-900 text-white text-[10px] p-1 rounded border border-slate-700 outline-none font-bold">
                                                    <option value="All">All Lvls</option><option value="AAA">AAA</option><option value="AA">AA</option><option value="A+">A+</option><option value="A">A</option><option value="Rk">Rk</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="flex gap-2 items-center">
                                            <input type="text" placeholder="Search..." value={farmSearch} onChange={e=>setFarmSearch(e.target.value)} className="flex-1 bg-slate-900 border border-slate-700/80 rounded px-2 py-1 text-[11px] text-white outline-none" />
                                            <div className="flex bg-slate-950 rounded border border-slate-700 p-0.5 shrink-0">
                                                {['All', 'Top 30', 'Top 100', '40-Man'].map(f => <button key={f} onClick={() => setFarmFilter(f)} className={`text-[9px] px-2 py-0.5 rounded font-bold transition-colors ${farmFilter===f?'bg-amber-600 text-white':'text-slate-400 hover:text-white'}`}>{f}</button>)}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex-1 overflow-y-auto pr-1 custom-scrollbar">
                                        <DropZone id="Minors" players={minors} onDrop={handleDrop} teamInfo={team} onPlayerClick={setActivePlayerModal} className="!border-none !bg-transparent !p-0" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const FieldView = ({ team, setMyTeam, showTxLog, setShowTxLog }) => {
            const handleFieldDrop = (playerId, targetZone, targetPlayerId = null) => {
                setMyTeam(prev => {
                    const roster = [...prev.roster];
                    const pIdx = roster.findIndex(p => p.id.toString() === playerId.toString());
                    if (pIdx === -1) return prev;
                    const player = roster[pIdx];

                    const tIdStr = String(targetZone);

                    if (tIdStr.startsWith('Pos-')) {
                        const newPos = tIdStr.split('-')[1];

                        roster.splice(pIdx, 1);

                        if (targetPlayerId) {
                            const newTargetIdx = roster.findIndex(p => p.id.toString() === targetPlayerId.toString() && (p.position === newPos || (newPos === 'SP' && p.fieldSpot === 'Rotation')));
                            if (newTargetIdx !== -1) {
                                roster.splice(newTargetIdx, 0, player);
                            } else {
                                roster.push(player);
                            }
                        } else {
                            roster.push(player);
                        }

                        player.position = newPos;
                        if (newPos === 'SP' && player.fieldSpot !== 'Rotation') {
                            const used = roster.filter(x => x.fieldSpot === 'Rotation').map(x => x.pitchingOrder).filter(Boolean);
                            let next = 1; while(used.includes(next)) next++;
                            player.pitchingOrder = next;
                            player.battingOrder = null;
                            player.fieldSpot = 'Rotation';
                            player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                        }
                    } else if (tIdStr.startsWith('Bat-')) {
                        const newOrder = parseInt(tIdStr.split('-')[1]);
                        const occupant = roster.find(p => p.fieldSpot === 'Lineup' && p.battingOrder === newOrder);
                        if (occupant && occupant.id !== player.id) {
                            occupant.battingOrder = player.fieldSpot === 'Lineup' ? player.battingOrder : null;
                            occupant.fieldSpot = player.fieldSpot === 'Lineup' ? 'Lineup' : 'Bench';
                            if (occupant.fieldSpot === 'Bench' && ['P', 'SP', 'RP'].includes(occupant.position)) occupant.position = 'DH';
                        }
                        player.pitchingOrder = null;
                        player.fieldSpot = 'Lineup';
                        player.battingOrder = newOrder;
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                    } else if (tIdStr.startsWith('Pen-')) {
                        const newOrder = parseInt(tIdStr.split('-')[1]);
                        const occupant = roster.find(p => p.fieldSpot === 'Bullpen' && p.pitchingOrder === newOrder);
                        if (occupant && occupant.id !== player.id) {
                            occupant.pitchingOrder = player.fieldSpot === 'Bullpen' ? player.pitchingOrder : null;
                            occupant.fieldSpot = player.fieldSpot === 'Bullpen' ? 'Bullpen' : 'Bench';
                            if (occupant.fieldSpot === 'Bench' && ['P', 'SP', 'RP'].includes(occupant.position)) occupant.position = 'DH';
                        }
                        player.battingOrder = null;
                        player.fieldSpot = 'Bullpen';
                        player.pitchingOrder = newOrder;
                        player.position = 'RP';
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                    } else if (tIdStr.startsWith('Rot-')) {
                        const newOrder = parseInt(tIdStr.split('-')[1]);
                        const occupant = roster.find(p => p.fieldSpot === 'Rotation' && p.pitchingOrder === newOrder);
                        if (occupant && occupant.id !== player.id) {
                            occupant.pitchingOrder = player.fieldSpot === 'Rotation' ? player.pitchingOrder : null;
                            occupant.fieldSpot = player.fieldSpot === 'Rotation' ? 'Rotation' : 'Bench';
                            if (occupant.fieldSpot === 'Bench' && ['P', 'SP', 'RP'].includes(occupant.position)) occupant.position = 'DH';
                        }
                        player.battingOrder = null;
                        player.fieldSpot = 'Rotation';
                        player.pitchingOrder = newOrder;
                        player.position = 'SP';
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                    } else if (tIdStr === 'Bullpen') {
                        const used = roster.filter(x => x.fieldSpot === 'Bullpen').map(x => x.pitchingOrder).filter(Boolean);
                        let next = 1; while(used.includes(next)) next++;
                        player.pitchingOrder = next;
                        player.battingOrder = null;
                        player.fieldSpot = 'Bullpen';
                        player.position = 'RP';
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                    } else if (tIdStr === 'Rotation') {
                        const used = roster.filter(x => x.fieldSpot === 'Rotation').map(x => x.pitchingOrder).filter(Boolean);
                        let next = 1; while(used.includes(next)) next++;
                        player.pitchingOrder = next;
                        player.battingOrder = null;
                        player.fieldSpot = 'Rotation';
                        player.position = 'SP';
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                    } else if (tIdStr === 'Bench') {
                        player.fieldSpot = 'Bench';
                        player.battingOrder = null;
                        player.pitchingOrder = null;
                        player.is40Man = true; player.rosterStatus = '26-Man Active'; player.injury = "";
                        if (['P', 'SP', 'RP'].includes(player.position)) player.position = 'DH';
                    }
                    return { ...prev, roster };
                });
            };

            const activeRoster = team.roster?.filter(p => ['Lineup', 'Bench', 'Rotation', 'Bullpen'].includes(p.fieldSpot)) || [];
            const rotation = team.roster?.filter(p => p.fieldSpot === 'Rotation') || [];
            const bullpen = team.roster?.filter(p => p.fieldSpot === 'Bullpen') || [];
            const il = team.roster?.filter(p => p.fieldSpot !== 'Pending FA' && (p.fieldSpot?.includes('IL') || p.injury?.toLowerCase().includes('injured'))) || [];

            // Dynamic Pitching Maps (Extends Infinitely if assigned, always leaves 1 empty drop slot at bottom)
            const rotSlots = Array.from({length: Math.max(5, Math.max(0, ...rotation.map(p => p.pitchingOrder || 0)) + 1)}, (_, i) => i + 1);
            const penSlots = Array.from({length: Math.max(4, Math.max(0, ...bullpen.map(p => p.pitchingOrder || 0)) + 1)}, (_, i) => i + 1);

            const displayTxs = useMemo(() => {
                const txs = [];
                let autoCount = 0;
                if (!team.transactions) return txs;
                team.transactions.forEach(tx => {
                    if (tx.msg && tx.msg.includes('Auto-Tendered')) {
                        autoCount++;
                    } else {
                        txs.push(tx);
                    }
                });
                if (autoCount > 0) {
                    txs.unshift({ type: 'sign', msg: `Auto-Tendered ${autoCount} Prospects & Pre-Arb Players`, logo: `https://www.mlbstatic.com/team-logos/${team.id}.svg` });
                }
                return txs;
            }, [team.transactions, team.id]);

            const FieldDepthBox = ({ label, id, left, top }) => {
                const posPlayers = activeRoster.filter(p => p.position === id || (id === 'SP' && p.fieldSpot === 'Rotation'));
                const isSP = id === 'SP';
                const transform = isSP ? 'translate(-50%, -100%)' : 'translate(-50%, -50%)';

                // Dynamic multiplier: Automatically shrinks the content to fit 10+ players seamlessly
                const count = posPlayers.length;
                const shrink = count > 8 ? 0.6 : count > 5 ? 0.75 : 1;

                return (
                    <div className="absolute border border-theme bg-slate-900 shadow-2xl flex flex-col rounded-md overflow-hidden"
                         style={{ left, top, transform, width: '8.5cqw', zIndex: isSP ? 20 : 10 }}
                         onDrop={(e) => { 
                             e.preventDefault(); 
                             e.stopPropagation();
                             handleFieldDrop(e.dataTransfer.getData('playerId'), `Pos-${id}`); 
                         }}
                         onDragOver={(e) => e.preventDefault()}
                    >
                        <div className="bg-theme text-white font-black uppercase text-center border-b border-theme shrink-0" style={{ fontSize: `${0.8 * shrink}cqw`, padding: `${0.2 * shrink}cqw` }}>{label}</div>
                        <div className="flex-1 p-0.5 bg-slate-900 flex flex-col overflow-hidden" style={{ gap: `${0.2 * shrink}cqw` }}>
                            {posPlayers.length === 0 && (
                                <div className="text-slate-500 italic text-center py-1 font-bold" style={{ fontSize: `${0.6 * shrink}cqw` }}>Empty</div>
                            )}
                            {posPlayers.map(p => {
                                const nameLen = p.name.length;
                                const fontSize = nameLen > 15 ? `${0.5 * shrink}cqw` : nameLen > 12 ? `${0.55 * shrink}cqw` : `${0.6 * shrink}cqw`;
                                return (
                                    <div key={p.id} draggable="true" 
                                         onDragStart={(e) => {
                                             e.dataTransfer.setData('playerId', String(p.id));
                                             e.stopPropagation();
                                         }}
                                         onDrop={(e) => {
                                             e.preventDefault();
                                             e.stopPropagation();
                                             handleFieldDrop(e.dataTransfer.getData('playerId'), `Pos-${id}`, p.id);
                                         }}
                                         onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); }}
                                         className="flex items-center cursor-pointer hover:bg-slate-800 text-slate-200 rounded px-0.5 shrink-0" style={{ padding: `${0.2 * shrink}cqw`, gap: `${0.4 * shrink}cqw` }}>
                                        <PlayerImage player={p} teamInfo={team} className="rounded-full object-cover shrink-0 border border-slate-700 bg-slate-950" style={{ width: `${1.6 * shrink}cqw`, height: `${1.6 * shrink}cqw` }} />
                                        <span className="truncate font-semibold text-slate-200" style={{ fontSize }}>{p.name}</span>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="w-full h-full bg-[#020617] flex flex-col items-center justify-start p-2 overflow-y-auto custom-scrollbar relative">
                    <div className="w-full bg-slate-900/80 border border-slate-800 rounded-lg mb-2 flex flex-col shrink-0 shadow-md">
                        <div className="flex justify-between items-center border-b border-slate-800 py-1 px-3 bg-slate-900/90 z-10 shrink-0">
                            <span className="text-[10px] font-black text-theme uppercase tracking-widest">Recent Activity</span>
                            <button onClick={() => setShowTxLog(!showTxLog)} className="text-[9px] font-bold text-slate-400 bg-slate-800 hover:text-white px-2 rounded transition-colors">
                                {showTxLog ? 'Collapse' : 'Expand'}
                            </button>
                        </div>
                        {showTxLog && (
                            <div className="flex flex-wrap gap-2 text-xs text-slate-300 p-2 items-start">
                                {displayTxs && displayTxs.length > 0 ? displayTxs.map((tx, i) => (
                                    <div key={i} className="flex items-center gap-1.5 shrink-0">
                                        {tx.type === 'trade' ? (
