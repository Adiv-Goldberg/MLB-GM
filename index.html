                            {activeSubTab === 'UFA' && (
                                <div className="flex items-center gap-3 bg-zinc-900 border border-zinc-700 px-3 py-1.5 rounded shadow-lg">
                                    <span className="text-[10px] text-zinc-400 font-bold uppercase tracking-widest">Show Declined Options</span>
                                    <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                        <input type="checkbox" checked={showDeclinedOptions} onChange={()=>setShowDeclinedOptions(!showDeclinedOptions)} className="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-zinc-500 z-10" />
                                        <label className="toggle-label block overflow-hidden h-5 rounded-full bg-zinc-500 cursor-pointer"></label>
                                    </div>
                                </div>
                            )}

                            <div className="flex gap-2">
                                <input type="text" placeholder="Search FA..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-xs text-white outline-none w-48" />
                                <select value={posFilter} onChange={e=>setPosFilter(e.target.value)} className="bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-xs text-white outline-none">
                                    <option value="All">All Pos</option><option value="SP">SP</option><option value="RP">RP</option><option value="C">C</option><option value="INF">INF</option><option value="OF">OF</option>
                                </select>
                                {activeSubTab === 'UFA' && (
                                    <select value={teamFilter} onChange={e=>setTeamFilter(e.target.value)} className="bg-zinc-900 border border-zinc-700 rounded px-3 py-1.5 text-xs text-white outline-none">
                                        <option value="All">All Teams</option>
                                        {TEAM_DB_INIT.map(t => <option key={t.id} value={t.id}>{t.abbr}</option>)}
                                    </select>
                                )}
                                <div className="flex bg-zinc-900 border border-zinc-800 rounded-lg p-0.5 gap-0.5 ml-2">
                                    {['Options', 'Arb', 'UFA'].map(tab => (
                                        <button key={tab} onClick={() => setActiveSubTab(tab)} className={`px-4 py-1.5 rounded font-bold text-xs transition-colors tracking-wide ${activeSubTab === tab ? 'bg-sky-600 text-white shadow' : 'text-zinc-400 hover:text-white hover:bg-zinc-800'}`}>
                                            {tab}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-x-auto w-full max-w-6xl mx-auto">
                        {sortedListToRender.length === 0 ? (
                            <div className="h-64 flex items-center justify-center text-zinc-600 font-black text-lg uppercase tracking-widest border-2 border-dashed border-zinc-800 rounded-xl">No pending players in this category</div>
                        ) : (
                            <div className="min-w-max bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-xl">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-zinc-950 text-zinc-400 text-xs uppercase tracking-widest select-none">
                                        <tr>
                                            <th onClick={() => handleSort('name')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400">Player ↕</th>
                                            <th className="px-4 py-3 font-bold border-b border-zinc-800">Team</th>
                                            <th onClick={() => handleSort('position')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400">Pos ↕</th>
                                            <th onClick={() => handleSort('age')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400">Age ↕</th>
                                            <th onClick={() => handleSort('cbtValue')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400">Previous AAV ↕</th>
                                            <th onClick={() => handleSort('expiryType')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400">Status ↕</th>
                                            <th className="px-4 py-3 font-bold border-b border-zinc-800 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-zinc-800/50">
                                        {sortedListToRender.map(p => {
                                            const pTeamInfo = p.teamInfo || team;
                                            const isMine = pTeamInfo.id === team.id;
                                            return (
                                                <tr key={`${pTeamInfo.id}-${p.id}`} className="hover:opacity-80 transition-opacity" style={getPlayerBgStyle(p, pTeamInfo)}>
                                                    <td className="px-4 py-2 font-bold text-white flex items-center gap-3 min-w-[200px]">
                                                        <PlayerImage player={p} teamInfo={pTeamInfo} className="w-8 h-8 rounded-full bg-zinc-800 object-cover border border-zinc-700" />
                                                        <span onClick={() => setNegotiatingPlayer(p)} className="cursor-pointer hover:text-sky-400 transition-colors drop-shadow-md">{p.name}</span>
                                                    </td>
                                                    <td className="px-4 py-2 font-semibold text-zinc-300">
                                                        <div className="flex items-center gap-2 drop-shadow-md">
                                                            <img src={`https://www.mlbstatic.com/team-logos/${pTeamInfo.id}.svg`} className="w-5 h-5" />
                                                            {pTeamInfo.abbr}
                                                        </div>
                                                    </td>
                                                    <td className="px-4 py-2 font-semibold text-zinc-100 drop-shadow-md">{p.position}</td>
                                                    <td className="px-4 py-2 font-semibold text-zinc-300 drop-shadow-md">{p.age}</td>
                                                    <td className="px-4 py-2 font-black text-emerald-400 drop-shadow-md">{formatMoney(p.cbtValue || p.aav)}</td>
                                                    <td className="px-4 py-2 drop-shadow-md">
                                                        <span className="bg-black/40 text-sky-300 border border-sky-800/50 px-2 py-0.5 rounded text-[10px] font-black uppercase backdrop-blur-sm">
                                                            {p.contractStatus === 'Declined Option' ? 'Declined' : p.expiryType}
                                                        </span>
                                                    </td>
                                                    <td className="px-4 py-2 text-right">
                                                        <div className="flex gap-2 justify-end drop-shadow-md">
                                                            <button onClick={() => setNegotiatingPlayer(p)} className="bg-emerald-600/30 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-700/50 px-3 py-1.5 rounded text-[10px] font-black uppercase transition-colors">
                                                                {activeSubTab === 'Options' ? 'Exercise' : activeSubTab === 'Arb' ? 'Settle Arb' : 'Sign'}
                                                            </button>
                                                            {(activeSubTab === 'Options' || activeSubTab === 'Arb') && isMine && (
                                                                <button onClick={() => handleDecision(p.id, pTeamInfo.id, 'release')} className="bg-red-600/30 hover:bg-red-600 text-red-400 hover:text-white border border-red-700/50 px-3 py-1.5 rounded text-[10px] font-black uppercase transition-colors">
                                                                    {activeSubTab === 'Options' ? 'Decline Option' : 'Non-Tender'}
                                                                </button>
                                                            )}
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const PayrollViewer = ({ team, setupData }) => {
            const activeContracts = team.roster.filter(p => p.is40Man || p.cbtList.some(v => v > 0));
            const getColSum = (idx) => activeContracts.reduce((sum, p) => sum + (p.cbtList[idx] || 0), 0);
            const totals = [0, 1, 2, 3, 4].map(idx => getColSum(idx));

            return (
                <div className="flex-1 flex flex-col h-full bg-zinc-950 p-6 overflow-hidden">
                    <div className="mb-6 shrink-0 max-w-6xl mx-auto w-full">
                        <h2 className="text-3xl font-black text-white tracking-tighter">5-Year Payroll Outlook</h2>
                        <p className="text-zinc-400 font-bold text-xs uppercase mt-1 tracking-widest">CBT (AAV) Liability</p>
                    </div>
                    
                    <div className="flex-1 overflow-x-auto max-w-6xl mx-auto w-full">
                        <div className="min-w-max bg-zinc-900 border border-zinc-800 rounded-xl shadow-xl">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-zinc-950 text-zinc-400 text-xs uppercase tracking-widest sticky top-0 z-20">
                                    <tr>
                                        <th className="px-6 py-4 font-bold border-b border-zinc-800">Player</th>
                                        {[2026, 2027, 2028, 2029, 2030].map(y => (
                                            <th key={y} className={`px-6 py-4 font-bold border-b border-zinc-800 text-right ${y === setupData.year ? 'text-sky-400' : ''}`}>{y}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-zinc-800/50">
                                    {activeContracts.map(p => (
                                        <tr key={p.id} className="hover:bg-zinc-800/50 transition-colors">
                                            <td className="px-6 py-3">
                                                <div className="font-bold text-white">{p.name}</div>
                                                <div className="text-[10px] text-zinc-500 uppercase font-semibold">{p.position} • {p.contractStatus}</div>
                                            </td>
                                            {[0, 1, 2, 3, 4].map(idx => (
                                                <td key={idx} className={`px-6 py-3 text-right font-semibold ${p.cbtList[idx] > 0 ? 'text-emerald-400' : 'text-zinc-600'}`}>
                                                    {p.cbtList[idx] > 0 ? formatMoney(p.cbtList[idx]) : '-'}
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                </tbody>
                                <tfoot className="bg-zinc-950 sticky bottom-0 z-20">
                                    <tr>
                                        <th className="px-6 py-4 font-black text-white uppercase tracking-widest border-t border-zinc-700">Total CBT Payroll</th>
                                        {[0, 1, 2, 3, 4].map(idx => (
                                            <th key={idx} className="px-6 py-4 text-right font-black text-white border-t border-zinc-700">
                                                {formatMoney(totals[idx])}
                                            </th>
                                        ))}
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const CreatePlayerTool = ({ team, setMyTeam, showNotification }) => {
            const [formData, setFormData] = useState({
                name: '', age: 22, position: 'SP',
                aav: 0, length: 1, expiryType: 'Pre-Arb', optionsLeft: 3, top100Rank: '', originalTeamId: team.id
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.name) return showNotification("Name required", "error");
                
                const fieldSpot = formData.position === 'SP' ? 'Rotation' : formData.position === 'RP' ? 'Bullpen' : 'Bench';
                const origId = parseInt(formData.originalTeamId);
                const acqVia = origId === 0 ? 'FA' : (origId === team.id ? 'Draft' : 'Trade');

                const newPlayer = {
                    id: `custom-${Date.now()}`,
                    name: formData.name,
                    initials: formData.name.split(' ').map(w => w[0]).join('').substring(0, 2),
                    age: parseInt(formData.age),
                    position: formData.position,
                    level: 'MLB',
                    rosterStatus: '26-Man Active',
                    injury: '',
                    optionsLeft: parseInt(formData.optionsLeft),
                    contractStatus: formData.expiryType,
                    aav: parseInt(formData.aav),
                    remaining: parseInt(formData.length),
                    expiryType: formData.expiryType,
                    cbtValue: parseInt(formData.aav),
                    cbtList: [parseInt(formData.aav), parseInt(formData.aav), parseInt(formData.aav), parseInt(formData.aav), parseInt(formData.aav)],
                    teamRank: null,
                    top100Rank: formData.top100Rank ? parseInt(formData.top100Rank) : null,
                    is40Man: true,
                    faStatus: 'Under Contract',
                    fieldSpot: fieldSpot,
                    battingOrder: null,
                    originalTeamId: origId,
                    acquiredVia: acqVia
                };

                setMyTeam(prev => ({ ...prev, roster: [...prev.roster, newPlayer] }));
                showNotification(`Created ${newPlayer.name}! Sent to Active Roster.`, "success");
                setFormData({ name: '', age: 22, position: 'SP', aav: 0, length: 1, expiryType: 'Pre-Arb', optionsLeft: 3, top100Rank: '', originalTeamId: team.id });
            };

            return (
                <div className="flex-1 flex flex-col h-full bg-zinc-950 p-6 overflow-hidden">
                    <div className="mb-6 shrink-0 max-w-xl mx-auto w-full text-center">
                        <h2 className="text-3xl font-black text-white tracking-tighter">Add Custom Player</h2>
                        <p className="text-zinc-400 font-bold text-xs uppercase mt-1 tracking-widest">Inject directly to MLB Active Roster</p>
                    </div>
                    
                    <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto max-w-xl mx-auto w-full bg-zinc-900 border border-zinc-800 p-6 rounded-xl shadow-xl flex flex-col gap-4">
                        <div>
                            <label className="text-xs text-zinc-400 font-bold block mb-1">Player Name</label>
                            <input type="text" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 p-2.5 rounded text-white font-bold outline-none" required />
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="text-xs text-zinc-400 font-bold block mb-1">Age</label>
                                <input type="number" value={formData.age} onChange={e=>setFormData({...formData, age: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 p-2.5 rounded text-white font-bold outline-none" />
                            </div>
                            <div>
                                <label className="text-xs text-zinc-400 font-bold block mb-1">Position</label>
                                <select value={formData.position} onChange={e=>setFormData({...formData, position: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 p-2.5 rounded text-white font-bold outline-none">
                                    <option value="SP">SP</option><option value="RP">RP</option><option value="C">C</option><option value="1B">1B</option><option value="2B">2B</option><option value="3B">3B</option><option value="SS">SS</option><option value="LF">LF</option><option value="CF">CF</option><option value="RF">RF</option><option value="DH">DH</option>
                                </select>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="text-xs text-zinc-400 font-bold block mb-1">Acquired From (Original Team)</label>
                                <select value={formData.originalTeamId} onChange={e=>setFormData({...formData, originalTeamId: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 p-2.5 rounded text-white font-bold outline-none">
                                    <option value={0}>Free Agency (MLB Logo)</option>
                                    {TEAM_DB_INIT.filter(t => t.id !== 0).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-xs text-zinc-400 font-bold block mb-1">Top 100 Prospect Rank (Optional)</label>
                                <input type="number" placeholder="e.g. 15" value={formData.top100Rank} onChange={e=>setFormData({...formData, top100Rank: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 p-2.5 rounded text-white font-bold outline-none" />
                            </div>
                        </div>
                        <div className="border-t border-zinc-800 pt-4 mt-2">
                            <h3 className="text-[10px] uppercase font-black text-sky-400 tracking-widest mb-3">Contract Settings</h3>
                            <div className="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label className="text-xs text-zinc-400 font-bold block mb-1">AAV Value ($)</label>
                                    <input type="number" value={formData.aav} onChange={e=>setFormData({...formData, aav: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 p-2.5 rounded text-white font-bold outline-none" />
                                </div>
                                <div>
                                    <label className="text-xs text-zinc-400 font-bold block mb-1">Length (Years)</label>
                                    <input type="number" value={formData.length} onChange={e=>setFormData({...formData, length: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 p-2.5 rounded text-white font-bold outline-none" />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="text-xs text-zinc-400 font-bold block mb-1">Contract Type</label>
                                    <select value={formData.expiryType} onChange={e=>setFormData({...formData, expiryType: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 p-2.5 rounded text-white font-bold outline-none">
                                        <option value="Pre-Arb">Pre-Arb</option><option value="Arb">Arbitration</option><option value="UFA">Free Agent (UFA)</option><option value="Minor">Minor League</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="text-xs text-zinc-400 font-bold block mb-1">Options Left</label>
                                    <select value={formData.optionsLeft} onChange={e=>setFormData({...formData, optionsLeft: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 p-2.5 rounded text-white font-bold outline-none">
                                        <option value={3}>3</option><option value={2}>2</option><option value={1}>1</option><option value={0}>0 (DFA on send down)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button type="submit" className="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 rounded-lg uppercase tracking-widest transition-transform active:scale-95 shadow-lg">
                            Inject Player
                        </button>
                    </form>
                </div>
            );
        };

        const App = () => {
            const [setupData, setSetupData] = useState(null); 
            const [myTeam, setMyTeam] = useState(null);
            const [activeTab, setActiveTab] = useState('roster');
            const [notification, setNotification] = useState(null);

            const showNotification = (msg, type='info') => {
                setNotification({msg, type});
                setTimeout(() => setNotification(null), 3000);
            };

            const handleTeamSelect = (teamData, mode, year) => {
                setMyTeam(teamData);
                setSetupData({ mode, year });
                setActiveTab('roster');
            };

            const saveGame = () => {
                if (!myTeam || !setupData) return showNotification("No active game to save.", "error");
                const saveData = { setupData, myTeam };
                const blob = new Blob([JSON.stringify(saveData)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${myTeam.abbr}_${setupData.year}.mlbgm`;
                a.click();
                URL.revokeObjectURL(url);
                showNotification("Game Saved to .mlbgm!", "success");
            };

            const loadGame = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.myTeam && data.setupData) {
                            setMyTeam(data.myTeam);
                            setSetupData(data.setupData);
                            setActiveTab('roster');
                            showNotification("Save File Loaded!", "success");
                        } else {
                            showNotification("Invalid .mlbgm Save File", "error");
                        }
                    } catch (err) {
                        showNotification("Failed to parse .mlbgm file", "error");
                    }
                };
                reader.readAsText(file);
                e.target.value = null; // reset input
            };

            if (!setupData || !myTeam) return <TeamSelect onSelect={handleTeamSelect} showNotification={showNotification} handleGlobalLoad={loadGame} />;

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-zinc-950 text-white">
                    <Toast notification={notification} />
                    
                    <div className="w-16 md:w-48 bg-zinc-900 border-r border-zinc-800 h-full flex flex-col shrink-0 z-50 shadow-2xl">
                        <div className="p-3 border-b border-zinc-800 flex flex-col items-center cursor-pointer hover:bg-zinc-800 transition-colors" onClick={() => { setSetupData(null); setMyTeam(null); }}>
                            <img src={`https://www.mlbstatic.com/team-logos/${myTeam.id}.svg`} className="w-8 h-8 md:w-12 md:h-12 mb-1 drop-shadow-lg" />
                            <p className="text-[8px] text-zinc-500 font-bold uppercase tracking-widest hidden md:block text-center">Change Team</p>
                        </div>
                        
                        <nav className="flex-1 py-3 space-y-1.5 px-2 overflow-y-auto">
                            <button onClick={() => setActiveTab('roster')} className={`w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs ${activeTab==='roster' ? 'bg-sky-600 text-white shadow' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}>
                                <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                                <span className="hidden md:inline tracking-wider">Dashboard</span>
                            </button>
                            <button onClick={() => setActiveTab('trades')} className={`w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs ${activeTab==='trades' ? 'bg-purple-600 text-white shadow' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}>
                                <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
                                <span className="hidden md:inline tracking-wider">Trades</span>
                            </button>
                            <button onClick={() => setActiveTab('payroll')} className={`w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs ${activeTab==='payroll' ? 'bg-amber-600 text-white shadow' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}>
                                <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08-.402-2.599-1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a99 0 11-18 0 9 9 0 0118 0z" /></svg>
                                <span className="hidden md:inline tracking-wider">Payroll</span>
                            </button>
                            {setupData.mode === 'offseason' && (
                                <button onClick={() => setActiveTab('fa')} className={`w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs ${activeTab==='fa' ? 'bg-emerald-600 text-white shadow' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}>
                                    <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                    <span className="hidden md:inline tracking-wider">Free Agency</span>
                                </button>
                            )}
                            <button onClick={() => setActiveTab('add')} className={`w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs ${activeTab==='add' ? 'bg-rose-600 text-white shadow' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}>
                                <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                                <span className="hidden md:inline tracking-wider">Add Player</span>
                            </button>
                        </nav>

                        {/* Save & Load Game Buttons */}
                        <div className="mt-auto border-t border-zinc-800 pt-3 flex flex-col gap-1.5 px-2 pb-3 shrink-0">
                            <button onClick={saveGame} className="w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs bg-zinc-950 text-zinc-400 border border-zinc-800 hover:text-white hover:border-sky-500">
                                <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                                <span className="hidden md:inline tracking-wider">Save Game</span>
                            </button>
                            <label className="w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs bg-zinc-950 text-zinc-400 border border-zinc-800 hover:text-white hover:border-emerald-500 cursor-pointer">
                                <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                                <span className="hidden md:inline tracking-wider">Load Game</span>
                                <input type="file" accept=".mlbgm" className="hidden" onChange={loadGame} />
                            </label>
                        </div>
                    </div>

                    <div className="flex-1 overflow-hidden relative">
                        {activeTab === 'roster' && <RosterDashboard team={myTeam} setTeam={setMyTeam} setupData={setupData} showNotification={showNotification} />}
                        {activeTab === 'trades' && <TradeSimulator myTeam={myTeam} setMyTeam={setMyTeam} setupData={setupData} showNotification={showNotification} />}
                        {activeTab === 'fa' && setupData.mode === 'offseason' && <FreeAgencyHub team={myTeam} setMyTeam={setMyTeam} setupData={setupData} showNotification={showNotification} />}
                        {activeTab === 'payroll' && <PayrollViewer team={myTeam} setupData={setupData} />}
                        {activeTab === 'add' && <CreatePlayerTool team={myTeam} setMyTeam={setMyTeam} showNotification={showNotification} />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
