                                        <button key={tab} onClick={() => setActiveSubTab(tab)} className={`px-3 py-1.5 rounded font-bold text-xs transition-colors tracking-wide ${activeSubTab === tab ? 'bg-sky-600 text-white shadow' : 'text-zinc-400 hover:text-white hover:bg-zinc-800'}`}>
                                            {tab}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-x-auto w-full max-w-6xl mx-auto rounded-xl">
                        {sortedListToRender.length === 0 ? (
                            <div className="h-64 flex items-center justify-center text-zinc-600 font-black text-lg uppercase tracking-widest border-2 border-dashed border-zinc-800 rounded-xl">No pending players in this category</div>
                        ) : (
                            <div className="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-xl min-w-max">
                                <table className="w-full text-left text-sm whitespace-nowrap table-auto">
                                    <thead className="bg-zinc-950 text-zinc-400 text-xs uppercase tracking-widest select-none">
                                        <tr>
                                            <th onClick={() => handleSort('name')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400 w-1/4">Player ↕</th>
                                            <th className="px-4 py-3 font-bold border-b border-zinc-800">Team</th>
                                            <th onClick={() => handleSort('position')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400">Position ↕</th>
                                            <th onClick={() => handleSort('age')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400">Age ↕</th>
                                            <th onClick={() => handleSort('cbtValue')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400">Previous AAV ↕</th>
                                            <th onClick={() => handleSort('expiryType')} className="px-4 py-3 font-bold border-b border-zinc-800 cursor-pointer hover:text-sky-400">Status ↕</th>
                                            <th className="px-4 py-3 font-bold border-b border-zinc-800 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-zinc-800/50">
                                        {sortedListToRender.map(p => {
                                            const pTeamInfo = p.teamInfo || team;
                                            const bgStyle = getPlayerBgStyle(p, pTeamInfo);
                                            
                                            return (
                                                <tr key={`${pTeamInfo.id}-${p.id}`} style={bgStyle} className="hover:opacity-80 transition-opacity">
                                                    <td className="px-4 py-3 font-bold text-white flex items-center gap-3 border-l-4" style={{ borderLeftColor: bgStyle.borderLeftColor }}>
                                                        <PlayerImage player={p} teamInfo={pTeamInfo} className="w-8 h-8 rounded-full bg-zinc-800 object-cover border border-zinc-600 shadow-md" />
                                                        <span onClick={() => setNegotiatingPlayer(p)} className="cursor-pointer hover:text-sky-400 transition-colors drop-shadow">{p.name}</span>
                                                    </td>
                                                    <td className="px-4 py-3 font-semibold text-zinc-300">
                                                        <div className="flex items-center gap-2">
                                                            <img src={`https://www.mlbstatic.com/team-logos/${pTeamInfo.id}.svg`} className="w-5 h-5 drop-shadow" />
                                                            <span className="drop-shadow">{pTeamInfo.abbr}</span>
                                                        </div>
                                                    </td>
                                                    <td className="px-4 py-3 font-semibold text-white drop-shadow">{p.position}</td>
                                                    <td className="px-4 py-3 font-semibold text-zinc-300 drop-shadow">{p.age}</td>
                                                    <td className="px-4 py-3 font-black text-emerald-400 drop-shadow-md">{formatMoney(p.cbtValue || p.aav)}</td>
                                                    <td className="px-4 py-3"><span className="bg-zinc-950/80 text-zinc-100 border border-zinc-700 px-2 py-0.5 rounded text-[10px] font-black uppercase shadow">{p.expiryType}</span></td>
                                                    <td className="px-4 py-3 text-right">
                                                        {activeSubTab === 'UFA' ? (
                                                            <button onClick={() => setNegotiatingPlayer(p)} className="bg-sky-600 hover:bg-sky-500 text-white font-black py-1.5 px-4 rounded text-xs uppercase transition-colors shadow-lg">Sign</button>
                                                        ) : (
                                                            <div className="flex gap-2 justify-end">
                                                                <button onClick={() => setNegotiatingPlayer(p)} className="bg-emerald-600 hover:bg-emerald-500 text-white font-black py-1.5 px-3 rounded text-xs uppercase transition-colors shadow-lg">
                                                                    {activeSubTab === 'Options' ? 'Exercise' : 'Settle'}
                                                                </button>
                                                                <button onClick={() => handleDecision(p.id, pTeamInfo.id, 'release')} className="bg-red-900/80 hover:bg-red-600 text-white font-black py-1.5 px-3 rounded text-xs uppercase transition-colors shadow-lg">
                                                                    {activeSubTab === 'Options' ? 'Decline Option' : 'Non-Tender'}
                                                                </button>
                                                            </div>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const PayrollViewer = ({ team, setupData }) => {
            const activeContracts = team.roster.filter(p => p.is40Man || p.cbtList.some(v => v > 0));
            const getColSum = (idx) => activeContracts.reduce((sum, p) => sum + (p.cbtList[idx] || 0), 0);
            const totals = [0, 1, 2, 3, 4].map(idx => getColSum(idx));

            return (
                <div className="flex-1 flex flex-col h-full bg-zinc-950 p-6 overflow-hidden">
                    <div className="mb-6 shrink-0 max-w-6xl mx-auto w-full">
                        <h2 className="text-3xl font-black text-white tracking-tighter">5-Year Payroll Outlook</h2>
                        <p className="text-zinc-400 font-bold text-xs uppercase mt-1 tracking-widest">CBT (AAV) Liability</p>
                    </div>
                    
                    <div className="flex-1 overflow-x-auto max-w-6xl mx-auto w-full rounded-xl">
                        <div className="bg-zinc-900 border border-zinc-800 rounded-xl shadow-xl min-w-max">
                            <table className="w-full text-left text-sm whitespace-nowrap table-auto">
                                <thead className="bg-zinc-950 text-zinc-400 text-xs uppercase tracking-widest sticky top-0 z-20">
                                    <tr>
                                        <th className="px-6 py-4 font-bold border-b border-zinc-800">Player</th>
                                        {[2026, 2027, 2028, 2029, 2030].map(y => (
                                            <th key={y} className={`px-6 py-4 font-bold border-b border-zinc-800 text-right ${y === setupData.year ? 'text-sky-400' : ''}`}>{y}</th>
                                        ))}
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-zinc-800/50">
                                    {activeContracts.map(p => {
                                        const bgStyle = getPlayerBgStyle(p, team);
                                        return (
                                        <tr key={p.id} style={bgStyle} className="hover:opacity-80 transition-opacity">
                                            <td className="px-6 py-3 border-l-4" style={{ borderLeftColor: bgStyle.borderLeftColor }}>
                                                <div className="flex items-center gap-3">
                                                    <PlayerImage player={p} teamInfo={team} className="w-8 h-8 rounded-full border border-zinc-600 object-cover shadow-md" />
                                                    <div>
                                                        <div className="font-bold text-white drop-shadow">{p.name}</div>
                                                        <div className="text-[10px] text-zinc-300 uppercase font-semibold drop-shadow">{p.position} • {p.contractStatus}</div>
                                                    </div>
                                                </div>
                                            </td>
                                            {[0, 1, 2, 3, 4].map(idx => (
                                                <td key={idx} className={`px-6 py-3 text-right font-black drop-shadow-md ${p.cbtList[idx] > 0 ? 'text-emerald-400' : 'text-zinc-500 font-normal'}`}>
                                                    {p.cbtList[idx] > 0 ? formatMoney(p.cbtList[idx]) : '-'}
                                                </td>
                                            ))}
                                        </tr>
                                    )})}
                                </tbody>
                                <tfoot className="bg-zinc-950 sticky bottom-0 z-20">
                                    <tr>
                                        <th className="px-6 py-4 font-black text-white uppercase tracking-widest border-t border-zinc-700">Total CBT Payroll</th>
                                        {[0, 1, 2, 3, 4].map(idx => (
                                            <th key={idx} className="px-6 py-4 text-right font-black text-white border-t border-zinc-700">
                                                {formatMoney(totals[idx])}
                                            </th>
                                        ))}
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [setupData, setSetupData] = useState(null); 
            const [myTeam, setMyTeam] = useState(null);
            const [activeTab, setActiveTab] = useState('roster');
            const [notification, setNotification] = useState(null);

            const showNotification = (msg, type='info') => {
                setNotification({msg, type});
                setTimeout(() => setNotification(null), 3000);
            };

            const handleTeamSelect = (teamData, mode, year) => {
                setMyTeam(teamData);
                setSetupData({ mode, year });
                setActiveTab('roster');
            };

            if (!setupData || !myTeam) return <TeamSelect onSelect={handleTeamSelect} showNotification={showNotification} />;

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-zinc-950 text-white">
                    <Toast notification={notification} />
                    
                    <div className="w-16 md:w-48 bg-zinc-900 border-r border-zinc-800 h-full flex flex-col shrink-0 z-50 shadow-2xl">
                        <div className="p-3 border-b border-zinc-800 flex flex-col items-center cursor-pointer hover:bg-zinc-800 transition-colors" onClick={() => { setSetupData(null); setMyTeam(null); }}>
                            <img src={`https://www.mlbstatic.com/team-logos/${myTeam.id}.svg`} className="w-8 h-8 md:w-12 md:h-12 mb-1 drop-shadow-lg" />
                            <p className="text-[8px] text-zinc-500 font-bold uppercase tracking-widest hidden md:block text-center">Change Team</p>
                        </div>
                        <nav className="flex-1 py-3 space-y-1.5 px-2">
                            <button onClick={() => setActiveTab('roster')} className={`w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs ${activeTab==='roster' ? 'bg-sky-600 text-white shadow' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}>
                                <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                                <span className="hidden md:inline tracking-wider">Dashboard</span>
                            </button>
                            <button onClick={() => setActiveTab('trades')} className={`w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs ${activeTab==='trades' ? 'bg-purple-600 text-white shadow' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}>
                                <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
                                <span className="hidden md:inline tracking-wider">Trades</span>
                            </button>
                            <button onClick={() => setActiveTab('payroll')} className={`w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs ${activeTab==='payroll' ? 'bg-amber-600 text-white shadow' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}>
                                <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                <span className="hidden md:inline tracking-wider">Payroll</span>
                            </button>
                            {setupData.mode === 'offseason' && (
                                <button onClick={() => setActiveTab('fa')} className={`w-full flex flex-col md:flex-row items-center justify-center md:justify-start gap-2.5 p-2.5 rounded-lg transition-all font-bold text-xs ${activeTab==='fa' ? 'bg-emerald-600 text-white shadow' : 'text-zinc-400 hover:bg-zinc-800 hover:text-white'}`}>
                                    <svg className="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                    <span className="hidden md:inline tracking-wider">Free Agency</span>
                                </button>
                            )}
                        </nav>
                    </div>

                    <div className="flex-1 overflow-hidden relative">
                        {activeTab === 'roster' && <RosterDashboard team={myTeam} setTeam={setMyTeam} setupData={setupData} showNotification={showNotification} />}
                        {activeTab === 'trades' && <TradeSimulator myTeam={myTeam} setMyTeam={setMyTeam} setupData={setupData} showNotification={showNotification} />}
                        {activeTab === 'fa' && setupData.mode === 'offseason' && <FreeAgencyHub team={myTeam} setMyTeam={setMyTeam} setupData={setupData} showNotification={showNotification} />}
                        {activeTab === 'payroll' && <PayrollViewer team={myTeam} setupData={setupData} />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
