                                            <div className="flex items-center bg-slate-950/50 px-2 py-1 rounded border border-slate-800 text-[0.85cqw] w-max">
                                                <img src={`https://www.mlbstatic.com/team-logos/${tx.teamA?.id}.svg`} className="w-[1.4cqw] h-[1.4cqw] mr-2 drop-shadow-md" crossOrigin="anonymous" />
                                                <span className="text-slate-200 font-bold">{tx.receivedByA?.length > 0 ? tx.receivedByA.map(p=>p.name).join(', ') : 'Cash'}</span>
                                                <span className="text-slate-500 font-bold mx-2">↔</span>
                                                <span className="text-slate-200 font-bold">{tx.receivedByB?.length > 0 ? tx.receivedByB.map(p=>p.name).join(', ') : 'Cash'}</span>
                                                <img src={`https://www.mlbstatic.com/team-logos/${tx.teamB?.id}.svg`} className="w-[1.4cqw] h-[1.4cqw] ml-2 drop-shadow-md" crossOrigin="anonymous" />
                                            </div>
                                        ) : (
                                            <div className="text-emerald-400 font-medium bg-slate-950/50 px-2 py-1 rounded border border-slate-800 text-[0.85cqw] flex items-center gap-2 w-max">
                                                <img src={tx.logo} className="w-[1.4cqw] h-[1.4cqw] drop-shadow-md object-contain" crossOrigin="anonymous"/>
                                                {tx.msg}
                                            </div>
                                        )}
                                    </div>
                                )) : <span className="text-slate-500 italic text-[0.85cqw]">No recent transactions</span>}
                            </div>
                        )}
                    </div>

                    <div className="relative border border-slate-800 flex overflow-hidden shadow-2xl bg-zinc-950 rounded-xl shrink-0"
                         style={{ aspectRatio: '16/9', width: '100%', maxWidth: 'calc((100vh - 85px) * 16 / 9)', maxHeight: 'calc(100vh - 85px)', containerType: 'size', margin: '0 auto' }}>
                        
                        <div className="h-full relative shadow-inner overflow-hidden border-r border-slate-800 flex flex-col" style={{ width: '56.25cqw' }}>
                            <div className="flex-1 relative overflow-hidden">
                                <img src="https://i.imgur.com/9QJw2f8.png" className="absolute inset-0 w-full h-full object-cover opacity-90" crossOrigin="anonymous" />
                                <FieldDepthBox label="C" id="C" left="50%" top="88%" />
                                <FieldDepthBox label="1B" id="1B" left="84%" top="56%" />
                                <FieldDepthBox label="2B" id="2B" left="68%" top="36%" />
                                <FieldDepthBox label="SS" id="SS" left="32%" top="36%" />
                                <FieldDepthBox label="3B" id="3B" left="16%" top="56%" />
                                <FieldDepthBox label="LF" id="LF" left="16%" top="20%" />
                                <FieldDepthBox label="CF" id="CF" left="50%" top="12%" />
                                <FieldDepthBox label="RF" id="RF" left="84%" top="20%" />
                                <FieldDepthBox label="DH" id="DH" left="14%" top="88%" />
                                <FieldDepthBox label="SP" id="SP" left="50%" top="76%" />
                            </div>
                            
                            <div className="h-[18%] bg-rose-950/20 border-t border-rose-900/40 shrink-0 flex items-center px-2 gap-2">
                                <span className="text-[0.8cqw] font-black uppercase text-rose-400 tracking-wider shrink-0 bg-rose-950/80 px-1.5 py-0.5 rounded border border-rose-900/50">IL</span>
                                <div className="flex-1 grid grid-rows-3 grid-flow-col gap-1 overflow-hidden h-full py-1">
                                    {il.slice(0, 17).map(p => (
                                        <div key={p.id} className="bg-rose-950/60 border border-rose-900/50 text-rose-200 rounded px-1 flex items-center gap-1 shadow-sm overflow-hidden" style={{ width: '8.5cqw', height: '100%' }}>
                                            <img src={`https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/${p.id}/headshot/silo/current`} 
                                                 className="rounded-full object-cover bg-slate-950 shrink-0 border border-rose-900/50" 
                                                 style={{ width: '1.2cqw', height: '1.2cqw' }} 
                                                 onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/120x120/0f172a/ffffff?text=${p.initials}`; }} crossOrigin="anonymous" />
                                            <span className="font-semibold truncate" style={{ fontSize: '0.65cqw' }}>{p.name}</span>
                                        </div>
                                    ))}
                                    {il.length > 17 && (
                                        <div className="bg-rose-950/40 border border-rose-900/50 rounded flex items-center justify-center text-rose-300 font-bold" style={{ width: '8.5cqw', height: '100%', fontSize: '0.65cqw' }}>
                                            + {il.length - 17} More
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="h-full flex flex-col bg-slate-900 overflow-hidden" style={{ width: '43.75cqw' }}>
                            <div className="flex flex-1 min-h-0">
                                <div className="w-1/2 h-full flex flex-col border-r border-slate-800">
                                    <div className="bg-sky-950 text-sky-300 font-bold uppercase text-center border-b border-slate-800 shrink-0" style={{ fontSize: '1cqw', padding: '0.4cqw' }}>Lineup</div>
                                    <div className="flex flex-col shrink-0 flex-1 justify-between p-0.5" style={{ gap: '1px' }}>
                                        {[1,2,3,4,5,6,7,8,9].map(num => {
                                            const p = activeRoster.find(x => x.fieldSpot === 'Lineup' && x.battingOrder === num);
                                            return (
                                                <div key={num} className="border border-slate-800 rounded flex flex-row items-center bg-slate-950 overflow-hidden shrink-0 flex-1 min-h-0"
                                                     onDrop={(e) => { e.preventDefault(); handleFieldDrop(e.dataTransfer.getData('playerId'), `Bat-${num}`); }}
                                                     onDragOver={(e) => e.preventDefault()}
                                                >
                                                    <div className="bg-slate-900 text-slate-400 font-black flex justify-center items-center shrink-0 border-r border-slate-800" style={{ width: '2cqw', height: '100%', fontSize: '0.8cqw' }}>#{num}</div>
                                                    <div className="flex-1 flex items-center bg-slate-950 h-full">
                                                        {p ? (
                                                            <div draggable="true" onDragStart={(e) => e.dataTransfer.setData('playerId', String(p.id))} className="w-full h-full flex items-center cursor-pointer hover:bg-slate-900 text-slate-200" style={{ padding: '0 0.4cqw', gap: '0.4cqw' }}>
                                                                <PlayerImage player={p} teamInfo={team} className="rounded-full object-cover shrink-0 border border-slate-700 bg-slate-800" style={{ width: '1.8cqw', height: '1.8cqw' }} />

                                    <div className="flex-1 flex flex-col drop-zone transition-colors p-0.5 justify-start" style={{ gap: '1px' }}

                                         onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('active'); }}>

                                            const label = idx === 0 ? 'CL' : idx <= 2 ? 'SU' : 'RP';
                                            return (
                                                <div key={p.id} className="border border-slate-800 rounded flex flex-row items-center bg-slate-950 overflow-hidden shrink-0 flex-1 min-h-0 relative z-10"
                                                     style={{ maxHeight: '12%' }}
                                                     onDrop={(e) => { e.preventDefault(); e.stopPropagation(); handleFieldDrop(e.dataTransfer.getData('playerId'), `Pen-${p.pitchingOrder}`); }}
                                                     onDragOver={(e) => e.preventDefault()}
                                                >
                                                    <div className="bg-slate-900 text-amber-500 font-black flex justify-center items-center shrink-0 border-r border-slate-800 pointer-events-none" style={{ width: '2cqw', height: '100%', fontSize: '0.75cqw' }}>{label}</div>
                                                    <div className="flex-1 flex items-center bg-slate-950 h-full pointer-events-none">
                                                        <div draggable="true" onDragStart={(e) => e.dataTransfer.setData('playerId', String(p.id))} className="w-full h-full flex items-center cursor-pointer hover:bg-slate-900 text-slate-200 pointer-events-auto" style={{ padding: '0 0.4cqw', gap: '0.4cqw' }}>
                                                            <PlayerImage player={p} teamInfo={team} className="rounded-full object-cover shrink-0 border border-slate-700 bg-slate-800" style={{ width: '1.8cqw', height: '1.8cqw' }} />
                                                            <span className="truncate font-semibold" style={{ fontSize: p.name.length > 14 ? '0.5cqw' : '0.6cqw' }}>{p.name}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-800 text-slate-300 font-bold uppercase text-center border-y border-slate-700 shrink-0" style={{ fontSize: '0.85cqw', padding: '0.2cqw' }}>Bench</div>
                            <div className="h-[28%] flex flex-wrap content-start bg-slate-900 overflow-hidden p-0.5" style={{ gap: '1px' }}
                                 onDrop={(e) => { e.preventDefault(); handleFieldDrop(e.dataTransfer.getData('playerId'), 'Bench'); }}
                                 onDragOver={(e) => e.preventDefault()}>
                                 {activeRoster.filter(p => p.fieldSpot === 'Bench').map(p => (
                                     <div key={p.id} draggable="true" onDragStart={(e) => e.dataTransfer.setData('playerId', String(p.id))} className="border border-slate-800 rounded flex flex-row items-center bg-slate-950 overflow-hidden cursor-pointer hover:bg-slate-900 text-slate-200 shrink-0" style={{ width: 'calc(33.3% - 1px)', height: 'calc(33.3% - 1px)', padding: '0 0.5cqw', gap: '0.6cqw' }}>
                                         <PlayerImage player={p} teamInfo={team} className="rounded-full object-cover shrink-0 border border-slate-700 bg-slate-800" style={{ width: '2.4cqw', height: '2.4cqw' }} />
                                         <span className="truncate font-semibold" style={{ fontSize: p.name.length > 14 ? '0.7cqw' : '0.85cqw' }}>{p.name}</span>

        };

        const TradeSimulator = ({ myTeam, setMyTeam, setupData, showNotification }) => {
            const [partnerTeam, setPartnerTeam] = useState(null);
            const [myTradeBlock, setMyTradeBlock] = useState([]);
            const [partnerTradeBlock, setPartnerTradeBlock] = useState([]);
            const [mySearch, setMySearch] = useState("");
            const [myPosFilter, setMyPosFilter] = useState("All");
            const [myStatusFilter, setMyStatusFilter] = useState("All");
            const [pSearch, setPSearch] = useState("");
            const [pPosFilter, setPPosFilter] = useState("All");
            const [pStatusFilter, setPStatusFilter] = useState("All");

            const loadPartner = async (teamId) => {
                if (!teamId) { setPartnerTeam(null); setPartnerTradeBlock([]); return; }
                const targetTeamMeta = TEAM_DB_INIT.find(t => t.id === parseInt(teamId));
                try {
                    const data = await fetchTeamData(targetTeamMeta, setupData.year, setupData.mode);
                    setPartnerTeam(data); setPartnerTradeBlock([]);
                } catch (e) { showNotification("Failed to load partner", "error"); }
            };

            const togglePlayerInTrade = (player, sourceTeamId) => {
                if (sourceTeamId === myTeam.id) {
                    if (myTradeBlock.find(x => x.id === player.id)) setMyTradeBlock(myTradeBlock.filter(x => x.id !== player.id));
                    else setMyTradeBlock([...myTradeBlock, player]);
                } else if (partnerTeam && sourceTeamId === partnerTeam.id) {
                    if (partnerTradeBlock.find(x => x.id === player.id)) setPartnerTradeBlock(partnerTradeBlock.filter(x => x.id !== player.id));
                    else setPartnerTradeBlock([...partnerTradeBlock, player]);
                }
            };

            const executeTrade = () => {
                if (!partnerTeam) return showNotification("Select a partner team", "error");
                const myNewRoster = myTeam.roster?.filter(p => !myTradeBlock.find(x => x.id === p.id)) || [];
                
                const acquired = [];
                partnerTradeBlock.forEach(p => {
                    const isPitcher = ['P','SP','RP'].includes(p.position);
                    const isMinors = p.level === 'Minors' || p.rosterStatus === 'Minors' || p.rosterStatus === '40-Man Minor';
                    let fSpot = isMinors ? 'Minors' : (isPitcher ? 'Bullpen' : 'Bench');
                    let rStatus = isMinors ? 'Minors' : '26-Man Active';
                    let is40 = !isMinors;
                    if (isMinors && p.is40Man) { fSpot = '40-Man Minor'; rStatus = '40-Man'; is40 = true; }

                    let pOrder = null;
                    if (fSpot === 'Bullpen') {
                        const used = [...myNewRoster, ...acquired].filter(x => x.fieldSpot === 'Bullpen').map(x => x.pitchingOrder).filter(Boolean);
                        let next = 1; while(used.includes(next)) next++;
                        pOrder = next;
                    }
                    
                    acquired.push({ 
                        ...p, 
                        fieldSpot: fSpot, 
                        is40Man: is40, 
                        rosterStatus: rStatus,
                        pitchingOrder: pOrder,
                        battingOrder: null
                    });
                });

                const tradeLog = { type: 'trade', teamA: myTeam, teamB: partnerTeam, receivedByA: partnerTradeBlock, receivedByB: myTradeBlock };
                setMyTeam({ ...myTeam, roster: [...myNewRoster, ...acquired], transactions: [tradeLog, ...(myTeam.transactions || [])] });
                setMyTradeBlock([]); setPartnerTradeBlock([]); setPartnerTeam(null);
                showNotification("Trade Executed Successfully!", "success");
            };

            const filterPlayers = (roster, block, search, pos, status) => {
                let available = roster?.filter(p => !block?.find(x => x.id === p.id) && p.fieldSpot !== 'Pending FA') || [];
                if (search) available = available.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
                if (pos !== 'All') {
                    if (pos === 'P') available = available.filter(p => ['P','SP','RP'].includes(p.position));
                    else if (pos === 'OF') available = available.filter(p => ['OF','LF','CF','RF'].includes(p.position));
                    else if (pos === 'INF') available = available.filter(p => ['1B','2B','3B','SS','INF'].includes(p.position));
                    else available = available.filter(p => p.position === pos);
                }
                if (status === 'Top 30') available = available.filter(p => p.teamRank && p.teamRank <= 30).sort((a,b) => a.teamRank - b.teamRank);
                else if (status === 'Top 100') available = available.filter(p => p.top100Rank && p.top100Rank <= 100).sort((a,b) => a.top100Rank - b.top100Rank);
                return available;
            };

            const myFiltered = filterPlayers(myTeam.roster, myTradeBlock, mySearch, myPosFilter, myStatusFilter);
            const pFiltered = partnerTeam ? filterPlayers(partnerTeam.roster, partnerTradeBlock, pSearch, pPosFilter, pStatusFilter) : [];

            return (
                <div className="flex-1 flex flex-col h-full bg-[#020617] p-6 overflow-hidden">
                    <div className="flex justify-between items-center mb-6 shrink-0 max-w-[1600px] mx-auto w-full">
                        <h2 className="text-2xl font-black text-white tracking-tighter">Trade Simulator</h2>
                        <select onChange={e => loadPartner(e.target.value)} className="bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm text-white font-bold w-64 shadow-lg outline-none">
                            <option value="">Select Partner...</option>
                            {TEAM_DB_INIT.filter(t => t.id !== myTeam.id).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 min-h-0 max-w-[1600px] mx-auto w-full">
                        <div className="lg:col-span-5 flex flex-col glass-panel rounded-2xl overflow-hidden shadow-xl h-full min-h-0">
                            <div className="bg-slate-900/80 p-3 border-b border-slate-700/50 shrink-0"><span className="text-xs font-black text-slate-300 uppercase tracking-widest">{myTeam.name}</span></div>
                            <div className="p-3 border-b border-slate-700/50 flex gap-2 shrink-0">
                                <input type="text" placeholder="Search..." value={mySearch} onChange={e=>setMySearch(e.target.value)} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none" />
                                <select value={myPosFilter} onChange={e=>setMyPosFilter(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none">
                                    {POS_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                </select>
                                <select value={myStatusFilter} onChange={e=>setMyStatusFilter(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none"><option value="All">All Status</option><option value="Top 30">Top 30</option><option value="Top 100">Top 100</option></select>
                            </div>
                            <div className="flex-1 overflow-y-auto p-3 flex flex-col gap-2 custom-scrollbar min-h-0">{myFiltered.map(p => <PlayerCard key={p.id} player={p} teamInfo={myTeam} onClick={() => togglePlayerInTrade(p, myTeam.id)} />)}</div>
                        </div>
                        <div className="lg:col-span-2 flex flex-col gap-4 h-full shrink-0 min-h-0 overflow-y-auto lg:overflow-visible">
                            <div className="flex-1 glass-panel rounded-2xl border border-rose-900/30 bg-rose-950/10 p-3 flex flex-col overflow-hidden min-h-[250px]">
                                <span className="text-[10px] uppercase font-black text-rose-400 mb-2 text-center shrink-0">Trading Away</span>
                                <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-1.5 min-h-0">
                                    {myTradeBlock.map(p => <PlayerCard key={p.id} player={p} teamInfo={myTeam} onClick={() => togglePlayerInTrade(p, myTeam.id)} />)}
                                </div>
                            </div>
                            <button onClick={executeTrade} disabled={!partnerTeam} className="bg-theme hover:brightness-110 text-white font-black py-4 rounded-xl shadow-[0_0_20px_rgba(56,189,248,0.2)] disabled:opacity-30 disabled:cursor-not-allowed uppercase shrink-0 transition-all">Execute</button>
                            <div className="flex-1 glass-panel rounded-2xl border border-emerald-900/30 bg-emerald-950/10 p-3 flex flex-col overflow-hidden min-h-[250px]">
                                <span className="text-[10px] uppercase font-black text-emerald-400 mb-2 text-center shrink-0">Acquiring</span>
                                <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-1.5 min-h-0">
                                    {partnerTradeBlock.map(p => <PlayerCard key={p.id} player={p} teamInfo={partnerTeam} onClick={() => togglePlayerInTrade(p, partnerTeam.id)} />)}
                                </div>
                            </div>
                        </div>
                        <div className="lg:col-span-5 flex flex-col glass-panel rounded-2xl overflow-hidden shadow-xl h-full min-h-0 relative">
                            {!partnerTeam ? <div className="flex-1 flex items-center justify-center text-slate-600 text-xs font-black uppercase text-center p-4">Select partner</div> : (
                                <>
                                    <div className="bg-slate-900/80 p-3 border-b border-slate-700/50 shrink-0"><span className="text-xs font-black text-slate-300 uppercase tracking-widest">{partnerTeam.name}</span></div>
                                    <div className="p-3 border-b border-slate-700/50 flex gap-2 shrink-0">
                                        <input type="text" placeholder="Search..." value={pSearch} onChange={e=>setPSearch(e.target.value)} className="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none" />
                                        <select value={pPosFilter} onChange={e=>setPPosFilter(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none">
                                            {POS_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                        </select>
                                        <select value={pStatusFilter} onChange={e=>setPStatusFilter(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none"><option value="All">All Status</option><option value="Top 30">Top 30</option><option value="Top 100">Top 100</option></select>
                                    </div>
                                    <div className="flex-1 overflow-y-auto p-3 flex flex-col gap-2 custom-scrollbar min-h-0">{pFiltered.map(p => <PlayerCard key={p.id} player={p} teamInfo={partnerTeam} onClick={() => togglePlayerInTrade(p, partnerTeam.id)} />)}</div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const FreeAgencyHub = ({ team, setMyTeam, setupData, showNotification }) => {
            const [activeSubTab, setActiveSubTab] = useState('UFA');
            const [leagueFaData, setLeagueFaData] = useState([]);
            const [declinedIds, setDeclinedIds] = useState(new Set());
            const [autoDeclineCPU, setAutoDeclineCPU] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: 'fWAR', direction: 'desc' });
            const [searchQuery, setSearchQuery] = useState("");
            const [posFilter, setPosFilter] = useState("All");
            const [teamFilter, setTeamFilter] = useState("All");
            const [signingPlayer, setSigningPlayer] = useState(null);
            const [offerAav, setOfferAav] = useState("");
            const [offerYears, setOfferYears] = useState(1);

            useEffect(() => {
                const fetchFAs = async () => {
                    try {
                        const results = await Promise.all(TEAM_DB_INIT.map(async t => {
                            try { const data = (t.id === team.id) ? team : await fetchTeamData(t, setupData.year, setupData.mode); return data.roster?.filter(p => p.fieldSpot === 'Pending FA').map(p => ({ ...p, teamInfo: t })) || []; } catch(e) { return []; }
                        }));
                        setLeagueFaData(results.flat());
                    } catch (e) { showNotification("Failed to load FAs", "error"); }
                }; fetchFAs();
            }, [team, setupData]);

            const handleSort = (key) => {
                let direction = 'desc';
                if (sortConfig.key === key && sortConfig.direction === 'desc') direction = 'asc';
                setSortConfig({ key, direction });
            };

            const handleSignPlayer = (player) => {
                setMyTeam(prev => {
                    const isPitcher = ['P', 'SP', 'RP'].includes(player.position);
                    const isMinors = player.level === 'Minors' || player.rosterStatus === 'Minors' || player.rosterStatus === '40-Man Minor';
                    let fSpot = isMinors ? 'Minors' : (isPitcher ? 'Bullpen' : 'Bench');
                    let rStatus = isMinors ? 'Minors' : '26-Man Active';
                    let is40 = !isMinors;
                    if (isMinors && player.is40Man) { fSpot = '40-Man Minor'; rStatus = '40-Man'; is40 = true; }

                    let pOrder = null;
                    if (fSpot === 'Bullpen') {
                        const used = (prev.roster || []).filter(x => x.fieldSpot === 'Bullpen' && x.id !== player.id).map(x => x.pitchingOrder).filter(Boolean);
                        let next = 1; while(used.includes(next)) next++;
                        pOrder = next;
                    }

                    const newPlayer = {...player, fieldSpot: fSpot, rosterStatus: rStatus, is40Man: is40, pitchingOrder: pOrder, battingOrder: null, teamInfo: undefined, originalTeamId: player.teamInfo.id, acquiredVia: 'FA'};
                    const tx = { type: 'sign', msg: `Signed ${player.name} to a ${player.contractStatus} contract`, logo: `https://www.mlbstatic.com/team-logos/${team.id}.svg` };
                    
                    const updatedRoster = prev.roster.filter(x => x.id !== newPlayer.id);
                    return { ...prev, roster: [...updatedRoster, newPlayer], transactions: [tx, ...(prev.transactions || [])] };
                });
                showNotification(`Signed ${player.name}!`, 'success');
            };

            const myTeamIds = new Set(team.roster.filter(p => p.fieldSpot !== 'Pending FA').map(p => p.id.toString()));
            
            const ufas = leagueFaData.filter(p => {
                if (myTeamIds.has(p.id.toString())) return false;
                const isCPU = p.teamInfo.id !== team.id;
                const isCPUDeclined = autoDeclineCPU && isCPU && (p.faStatus === 'Option' || p.faStatus === 'Arb');
                return p.faStatus === 'UFA' || declinedIds.has(p.id.toString()) || isCPUDeclined;
            });
            const arbs = leagueFaData.filter(p => p.teamInfo.id === team.id && p.faStatus === 'Arb' && !myTeamIds.has(p.id.toString()) && !declinedIds.has(p.id.toString()));
            const opts = leagueFaData.filter(p => p.teamInfo.id === team.id && p.faStatus === 'Option' && !myTeamIds.has(p.id.toString()) && !declinedIds.has(p.id.toString()));
            let rawList = activeSubTab === 'UFA' ? ufas : activeSubTab === 'Arb' ? arbs : opts;

            if (searchQuery) rawList = rawList.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
            if (teamFilter !== 'All') rawList = rawList.filter(p => String(p.teamInfo?.id) === teamFilter);
            if (posFilter !== 'All') {
                if (posFilter === 'P') rawList = rawList.filter(p => ['P','SP','RP'].includes(p.position));
                else if (posFilter === 'OF') rawList = rawList.filter(p => ['OF','LF','CF','RF'].includes(p.position));
                else if (posFilter === 'INF') rawList = rawList.filter(p => ['1B','2B','3B','SS','INF'].includes(p.position));
                else rawList = rawList.filter(p => p.position === posFilter);
            }

            const sortedList = useMemo(() => {
                let list = [...rawList];
                list.sort((a, b) => {
                    let aVal, bVal;
                    if (sortConfig.key === 'aav') { aVal = a.cbtValue || a.aav || 0; bVal = b.cbtValue || b.aav || 0; }
                    else if (['name', 'age', 'position'].includes(sortConfig.key)) { aVal = a[sortConfig.key]; bVal = b[sortConfig.key]; }
                    else if (sortConfig.key === 'team') { aVal = a.teamInfo?.abbr || ""; bVal = b.teamInfo?.abbr || ""; }
                    else if (sortConfig.key === 'OPS') {
                        const aOBP = parseFloat(a.stats?.OBP || 0); const aSLG = parseFloat(a.stats?.SLG || 0);
                        const bOBP = parseFloat(b.stats?.OBP || 0); const bSLG = parseFloat(b.stats?.SLG || 0);
                        aVal = aOBP + aSLG > 0 ? (aOBP + aSLG) : null;
                        bVal = bOBP + bSLG > 0 ? (bOBP + bSLG) : null;
                    }
                    else {
                        aVal = parseFloat(a.stats?.[sortConfig.key]);
                        bVal = parseFloat(b.stats?.[sortConfig.key]);
                        if (isNaN(aVal)) aVal = null;
                        if (isNaN(bVal)) bVal = null;
                    }

                    const isAEmpty = aVal === "" || aVal == null || aVal === "-";
                    const isBEmpty = bVal === "" || bVal == null || bVal === "-";
                    
                    if (isAEmpty && !isBEmpty) return 1;
                    if (!isAEmpty && isBEmpty) return -1;
                    if (isAEmpty && isBEmpty) return 0;

                    if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                }); return list;
            }, [rawList, sortConfig]);

            return (
                <div className="flex-1 flex flex-col h-full overflow-y-auto bg-[#020617] p-6 relative">
                    {signingPlayer && (
                        <div className="fixed inset-0 z-[300] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                                <div className="flex items-center gap-4 mb-5 border-b border-slate-800 pb-4">
                                    <PlayerImage player={signingPlayer} teamInfo={signingPlayer.teamInfo || team} className="w-14 h-14 rounded-full border-2 border-slate-700 object-cover bg-slate-950" />
                                    <div>
                                        <h3 className="text-lg font-black text-slate-100 leading-tight">{signingPlayer.name}</h3>
                                        <p className="text-xs text-slate-400 font-medium">{signingPlayer.position} • Prev AAV: {formatMoney(signingPlayer.cbtValue || signingPlayer.aav)}</p>
                                    </div>
                                </div>
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="text-[10px] text-theme font-bold uppercase tracking-widest mb-2 block">Contract Length (Years)</label>
                                        <input type="number" value={offerYears} onChange={e=>setOfferYears(e.target.value)} min={1} max={15} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white outline-none focus-border-theme" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-emerald-400 font-bold uppercase tracking-widest mb-2 block">AAV (Salary per year)</label>
                                        <input type="text" value={offerAav} onChange={(e) => {
                                            const raw = e.target.value.replace(/\s/g, '');
                                            if (!isNaN(raw)) {
                                                setOfferAav(raw.replace(/\B(?=(\d{3})+(?!\d))/g, " "));
                                            }
                                        }} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white outline-none focus:border-emerald-500" />
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setSigningPlayer(null)} className="w-1/2 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs uppercase tracking-wider transition-colors">Cancel</button>
                                    <button onClick={() => {
                                        const y = parseInt(offerYears) || 1;
                                        const a = parseInt(offerAav.replace(/\s/g, '')) || 740000;
                                        setMyTeam(prev => {
                                            const isPitcher = ['P', 'SP', 'RP'].includes(signingPlayer.position);

            const handleTeamSelect = (teamData, mode, year) => { setMyTeam(teamData); setSetupData({ mode, year }); setActiveTab('roster'); };

            const exportSave = () => {
                const stateStr = JSON.stringify({ teamData: myTeam, setupData });
                const blob = new Blob([stateStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `${myTeam.abbr}_save.mlbgm`;
                link.href = url; link.click();
            };

            const handleLoadGame = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const state = JSON.parse(event.target.result);
                        if (!state.teamData || !state.setupData) throw new Error("Invalid Format");
                        setMyTeam(state.teamData);
                        setSetupData(state.setupData);
                        setActiveTab('roster');
                        showNotification(`Loaded ${state.teamData.name} Save!`, 'success');
                    } catch (err) {
                        showNotification("Corrupted save file", "error");
                    }
                };
                reader.readAsText(file);
            };

            const clearSession = () => { setSetupData(null); setMyTeam(null); };

            useEffect(() => {
                const scrollZones = document.querySelectorAll('.custom-scrollbar, #scroll-container');
                scrollZones.forEach(zone => polyfillAutoScroll(zone));
            }, [activeTab]);

            // Dynamic Theming effect
            useEffect(() => {
                if (myTeam) {
                    document.documentElement.style.setProperty('--team-primary', myTeam.color);
                    document.documentElement.style.setProperty('--team-secondary', myTeam.secondary);
                } else {
                    document.documentElement.style.setProperty('--team-primary', '#38bdf8');
                    document.documentElement.style.setProperty('--team-secondary', '#0ea5e9');
                }
            }, [myTeam]);

            const polyfillAutoScroll = (el) => {
                let scrollInterval;
                el.addEventListener('dragover', (e) => {
                    const rect = el.getBoundingClientRect();
                    const edge = 50; 
                    clearInterval(scrollInterval);
                    if (e.clientY < rect.top + edge) scrollInterval = setInterval(() => el.scrollTop -= 5, 20);
                    else if (e.clientY > rect.bottom - edge) scrollInterval = setInterval(() => el.scrollTop += 5, 20);
                });
                el.addEventListener('dragleave', () => clearInterval(scrollInterval));
                el.addEventListener('drop', () => clearInterval(scrollInterval));
            };

            if (!setupData || !myTeam) return <TeamSelect onSelect={handleTeamSelect} showNotification={showNotification} />;

            return (
                <div className="flex flex-col h-screen w-screen bg-[#020617] text-slate-100 font-sans overflow-hidden">
                    <Toast notification={notification} />
                    <TopNavbar team={myTeam} activeTab={activeTab} setActiveTab={setActiveTab} exportSave={exportSave} clearSession={clearSession} handleLoadGame={handleLoadGame} />
                    <main className="flex-1 overflow-hidden relative">
                        {activeTab === 'roster' && <RosterDashboard team={myTeam} setTeam={setMyTeam} setupData={setupData} showNotification={showNotification} showTxLog={showTxLog} setShowTxLog={setShowTxLog} />}
                        {activeTab === 'field' && <FieldView team={myTeam} setMyTeam={setMyTeam} showTxLog={showTxLog} setShowTxLog={setShowTxLog} />}
                        {activeTab === 'trades' && <TradeSimulator myTeam={myTeam} setMyTeam={setMyTeam} setupData={setupData} showNotification={showNotification} />}
                        {activeTab === 'fa' && setupData.mode === 'offseason' && <FreeAgencyHub team={myTeam} setMyTeam={setMyTeam} setupData={setupData} showNotification={showNotification} />}
                        {activeTab === 'stats' && <StatsViewer team={myTeam} />}
                        {activeTab === 'add' && <CreatePlayerTool team={myTeam} setMyTeam={setMyTeam} showNotification={showNotification} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
